<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trafikkamera</title>
<meta name="description" content="Live trafikkameraer fra Stavanger, Sandnes, Sola og Haugesund.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Control-room camera wall: one dark surface, groups stacked, tiles in a fluid 16:9 grid */
:root {
  --bg: #0d1013;
  --panel: #151a1f;
  --line: #262e36;
  --fg: #e6ebef;
  --muted: #8794a0;
  --amber: #f2b632;      /* road-sign yellow: the one accent */
  --live: #e5484d;
  --ok: #46a758;
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg); font: 15px/1.5 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
header {
  display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px;
  padding-block: 28px 20px; border-bottom: 1px solid var(--line); margin-bottom: 8px;
}
h1 {
  font: 700 clamp(28px, 5vw, 40px)/1 var(--display); letter-spacing: .02em; text-transform: uppercase; margin: 0;
  display: flex; align-items: center; gap: 12px;
}
h1 .sign { width: .9em; height: .9em; border: 3px solid var(--amber); border-radius: 4px; display: grid; place-items: center; }
h1 .sign::after { content: ""; width: 40%; height: 40%; background: var(--amber); border-radius: 50%; }
.meta { font: 500 13px/1.4 var(--mono); color: var(--muted); display: flex; gap: 16px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.meta b { color: var(--fg); font-weight: 500; }
nav { display: flex; gap: 8px; flex-wrap: wrap; padding-block: 12px; }
nav button {
  font: 600 14px/1 var(--display); letter-spacing: .06em; text-transform: uppercase;
  background: transparent; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; cursor: pointer;
}
nav button[aria-pressed="true"] { color: var(--bg); background: var(--amber); border-color: var(--amber); }
nav button:focus-visible, .tile:focus-visible, .x:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
section { margin-top: 24px; }
h2 {
  font: 600 15px/1 var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--amber);
  margin: 0 0 12px; display: flex; align-items: center; gap: 10px;
}
h2 small { font: 400 12px var(--mono); letter-spacing: 0; color: var(--muted); text-transform: none; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 12px; }
.tile {
  background: var(--panel); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; cursor: zoom-in;
  display: flex; flex-direction: column; min-width: 0; text-align: left; color: inherit; padding: 0; font: inherit;
}
.screen { position: relative; aspect-ratio: 16 / 9; max-width: 100%; background: #000; }
.screen video, .screen img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.badge {
  position: absolute; bottom: 8px; left: 8px; font: 600 12px/1 var(--display); letter-spacing: .1em; text-transform: uppercase;
  background: rgba(0,0,0,.6); padding: 5px 8px; border-radius: 3px; display: flex; align-items: center; gap: 6px;
}
.badge i { width: 7px; height: 7px; border-radius: 50%; background: var(--live); }
.badge.still i { background: var(--muted); }
.badge.live i { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.age { position: absolute; bottom: 8px; right: 8px; font: 500 11px/1 var(--mono); background: rgba(0,0,0,.6); padding: 4px 6px; border-radius: 3px; font-variant-numeric: tabular-nums; }
.msg { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 16px; color: var(--muted); font: 500 13px var(--mono); }
.cap { padding: 10px 12px 12px; display: grid; gap: 2px; min-width: 0; }
.cap strong { font: 600 18px/1.15 var(--display); letter-spacing: .02em; overflow-wrap: anywhere; }
.cap span { font-size: 13px; color: var(--muted); }
.big {
  position: fixed; inset: 0; z-index: 2000; background: var(--bg); display: flex; flex-direction: column; gap: 12px;
  padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.big .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.big .bar strong { font: 700 24px/1.1 var(--display); text-transform: uppercase; letter-spacing: .02em; }
.big .bar a { color: var(--muted); font-size: 13px; }
.big .screen { flex: 1; aspect-ratio: auto; border-radius: 6px; overflow: hidden; }
.big .screen video, .big .screen img { object-fit: contain; }
.x { background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 999px; width: 40px; height: 40px; font-size: 20px; cursor: pointer; flex: none; }
#map { position: relative; z-index: 0; isolation: isolate; height: clamp(300px, 52vh, 560px); border: 1px solid var(--line); border-radius: 6px; background: var(--panel); margin-top: 4px; }
.leaflet-container { font: 13px var(--body); background: #1b2026; }
/* OSM tiles turned into a night map, so the pins and the camera wall share one dark look */
.night { filter: invert(1) hue-rotate(180deg) brightness(.85) contrast(.9) saturate(.5); }
.leaflet-tooltip { background: var(--panel); color: var(--fg); border: 1px solid var(--line); box-shadow: none; font: 600 15px/1.2 var(--display); letter-spacing: .02em; }
.leaflet-tooltip-top::before { border-top-color: var(--line); }
.leaflet-control-attribution { background: rgba(13,16,19,.75) !important; color: var(--muted) !important; }
.leaflet-control-attribution a { color: var(--muted) !important; }
.leaflet-bar a { background: var(--panel); color: var(--fg); border-color: var(--line); }
.pin { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--bg); background: var(--live); box-shadow: 0 0 0 2px var(--live); display: grid; place-items: center; }
.pin.still { background: var(--muted); box-shadow: 0 0 0 2px var(--muted); }
.pin::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--bg); }
.leaflet-marker-icon:hover .pin, .leaflet-marker-icon:focus .pin { background: var(--amber); box-shadow: 0 0 0 2px var(--amber); }
.nomap { color: var(--muted); font-size: 13px; margin: 8px 0 0; }
footer { margin-top: 40px; color: var(--muted); font-size: 13px; }
footer a { color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .badge.live i { animation: none; } }
</style>
</head>
<body>
<header>
  <h1><span class="sign" aria-hidden="true"></span>Trafikkamera</h1>
  <div class="meta"><span id="count">Henter kameraer…</span><span>Oppdatert <b id="upd">–</b></span><span id="clock"></span></div>
</header>
<nav id="nav" aria-label="Velg vegg"></nav>
<div id="map" role="region" aria-label="Kart over kameraene. Trykk på en nål for å se kameraet."></div>
<p class="nomap" id="nomap" hidden></p>
<main id="walls"></main>
<footer>Bilder og video fra Statens vegvesen, Stavanger Aftenblad og Jatec. Kameralisten hentes fra Trafikksentralen og oppdateres hvert 5. minutt.</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const API = 'api/state';
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let cams = [], filter = 'Alle', sig = '';
const players = new Map();   // tile element -> { stop() }

// the camera list has no coordinates: Vegvesen cameras are placed by their camera id (positions from Vegvesen's
// own weather/camera map), the others by name. A camera matching neither is listed below the map.
const VV = {
  1129016: [58.96207, 5.6147738],   // Sundekrossen
  1129018: [59.122208, 5.680165],   // Rennesøy
  1129024: [58.88421, 5.7182665],   // Forus
  1129027: [59.0126, 5.635277],     // Harestad
  1129032: [58.89665, 5.677254],    // Solasplitten
  1129037: [59.17073, 5.4504027],   // Arsvågen ferjekai
  1129038: [58.95924, 5.7223744],   // Kiellandsmyra
};
const BY_NAME = [
  [/kannik.*vest/i, [58.96525, 5.72560]],
  [/kannik/i, [58.96545, 5.72700]],
  [/tjensvoll/i, [58.95661, 5.70026]],
  [/smedasund/i, [59.41212, 5.26693]],
  [/oljemuse/i, [58.97360, 5.73476]],
  [/sandnes.*v[åa]gen|v[åa]gen.*sandnes/i, [58.85245, 5.74237]],
  [/hanafjell/i, [58.8335, 5.7960]],
];
function where(cam) {
  const id = (cam.url.match(/\/(11\d{5})_(\d)/) || [])[1];
  if (id && VV[id]) return VV[id];
  const hit = BY_NAME.find(([re]) => re.test(cam.name));
  return hit ? hit[1] : null;
}

let map = null, pins = null;
function drawMap(list) {
  if (!window.L) return;
  if (!map) {
    map = L.map('map', { scrollWheelZoom: false, zoomSnap: 0.25 }).setView([58.95, 5.72], 11);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, className: 'night',
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);
    map.on('focus', () => map.scrollWheelZoom.enable());
    map.on('blur', () => map.scrollWheelZoom.disable());
    pins = L.layerGroup().addTo(map);
  }
  pins.clearLayers();
  const seen = new Map(), pts = [], missing = [];
  list.forEach(cam => {
    let ll = where(cam);
    if (!ll) { missing.push(cam.name); return; }
    // two cameras on the same mast: fan the second pin out a little so both can be tapped
    const k = ll.join(), n = seen.get(k) || 0; seen.set(k, n + 1);
    if (n) ll = [ll[0] + 0.0012 * Math.sin(n * 2.1), ll[1] + 0.0024 * Math.cos(n * 2.1)];
    const live = cam.type === 'hls';
    const m = L.marker(ll, {
      icon: L.divIcon({ className: '', html: `<div class="pin ${live ? '' : 'still'}"></div>`, iconSize: [22, 22], iconAnchor: [11, 11] }),
      title: cam.name, keyboard: true, riseOnHover: true
    }).bindTooltip(cam.name + (live ? '' : ' · stillbilde'), { direction: 'top', offset: [0, -12] });
    m.on('click', () => open(cam));
    m.addTo(pins); pts.push(ll);
  });
  // zoom to where most cameras are; a lone far-off one (Haugesund) stays reachable by zooming out
  if (pts.length) {
    const mid = i => pts.map(q => q[i]).sort((a, b) => a - b)[pts.length >> 1];
    const c = L.latLng(mid(0), mid(1));
    const near = pts.filter(q => c.distanceTo(q) < 25000);
    map.fitBounds(near.length ? near : pts, { padding: [40, 40], maxZoom: 14 });
  }
  const nm = $('#nomap');
  nm.hidden = !missing.length;
  nm.textContent = missing.length ? 'Ikke på kartet (mangler posisjon): ' + missing.join(', ') : '';
}

function clock() { $('#clock').textContent = new Date().toLocaleTimeString('no-NO'); }
setInterval(clock, 1000); clock();

// one media element per tile; videos only play while on screen
function mount(screen, cam, big = false) {
  const age = document.createElement('span'); age.className = 'age';
  const msg = document.createElement('div'); msg.className = 'msg';
  if (cam.type === 'hls') {
    const v = document.createElement('video');
    v.muted = true; v.playsInline = true; v.autoplay = true; if (big) v.controls = true;
    screen.prepend(v);
    let hls = null;
    const fail = () => { msg.textContent = 'Strømmen svarer ikke akkurat nå'; screen.append(msg); };
    const start = () => {
      msg.remove();
      if (window.Hls && Hls.isSupported()) {
        hls = new Hls({ liveSyncDurationCount: 3, maxBufferLength: 10 });
        hls.on(Hls.Events.ERROR, (_, d) => { if (d.fatal) { hls.destroy(); hls = null; fail(); setTimeout(() => !hls && start(), 30000); } });
        hls.loadSource(cam.url); hls.attachMedia(v);
      } else if (v.canPlayType('application/vnd.apple.mpegurl')) { v.src = cam.url; v.onerror = fail; }
      else fail();
      v.play().catch(() => {});
    };
    const stop = () => { if (hls) { hls.destroy(); hls = null; } v.removeAttribute('src'); v.load(); };
    return { start, stop };
  }
  const img = document.createElement('img'); img.alt = cam.name; img.decoding = 'async';
  screen.prepend(img); screen.append(age);
  let t = 0, at = 0, ti = 0;
  const load = () => { const u = new URL(cam.url); u.searchParams.set('t', Date.now()); img.src = u; };
  img.onload = () => { at = Date.now(); msg.remove(); };
  img.onerror = () => { msg.textContent = 'Bildet kunne ikke hentes'; screen.append(msg); };
  const tick = () => { age.textContent = at ? Math.round((Date.now() - at) / 1000) + ' s siden' : 'laster'; };
  return {
    start() { load(); t = setInterval(load, (cam.interval || 60) * 1000); ti = setInterval(tick, 1000); },
    stop() { clearInterval(t); clearInterval(ti); }
  };
}

const io = new IntersectionObserver(es => es.forEach(e => {
  const p = players.get(e.target); if (!p) return;
  if (e.isIntersecting && !p.on) { p.on = true; p.start(); }
  else if (!e.isIntersecting && p.on) { p.on = false; p.stop(); }
}), { rootMargin: '200px' });

function tile(cam) {
  const b = document.createElement('button'); b.className = 'tile'; b.type = 'button';
  b.setAttribute('aria-label', 'Åpne ' + cam.name + ' i stort format');
  const live = cam.type === 'hls';
  b.innerHTML = `<div class="screen"><span class="badge ${live ? 'live' : 'still'}"><i></i>${live ? 'Direkte' : 'Stillbilde'}</span></div>
    <div class="cap"><strong>${esc(cam.name)}</strong><span>${esc([cam.provider, cam.address || cam.municipality].filter(Boolean).join(' · '))}</span></div>`;
  players.set(b, mount($('.screen', b), cam));
  io.observe(b);
  b.onclick = () => open(cam);
  return b;
}

function render() {
  players.forEach(p => p.on && p.stop()); players.clear(); io.disconnect();
  const walls = [...new Set(cams.map(c => c.wall || 'Andre'))];
  const nav = $('#nav'); nav.innerHTML = '';
  ['Alle', ...walls].forEach(w => {
    const n = document.createElement('button'); n.type = 'button'; n.textContent = w;
    n.setAttribute('aria-pressed', w === filter); n.onclick = () => { filter = w; render(); };
    nav.append(n);
  });
  drawMap(cams.filter(c => filter === 'Alle' || (c.wall || 'Andre') === filter));
  const main = $('#walls'); main.innerHTML = '';
  walls.filter(w => filter === 'Alle' || w === filter).forEach(w => {
    const list = cams.filter(c => (c.wall || 'Andre') === w);
    const s = document.createElement('section');
    s.innerHTML = `<h2>${esc(w)} <small>${list.length} kamera${list.length === 1 ? '' : 'er'}</small></h2><div class="grid"></div>`;
    list.forEach(c => $('.grid', s).append(tile(c)));
    main.append(s);
  });
  const live = cams.filter(c => c.type === 'hls').length;
  $('#count').innerHTML = `<b>${cams.length}</b> kameraer · <b>${live}</b> direkte`;
}

function open(cam) {
  const d = document.createElement('div'); d.className = 'big'; d.setAttribute('role', 'dialog'); d.setAttribute('aria-label', cam.name);
  d.innerHTML = `<div class="bar"><div><strong>${esc(cam.name)}</strong><br>${cam.source ? `<a href="${esc(cam.source)}" target="_blank" rel="noopener">Kilde: ${esc(cam.provider || cam.source)}</a>` : `<a>${esc(cam.provider || '')}</a>`}</div><button class="x" type="button" aria-label="Lukk">×</button></div><div class="screen"></div>`;
  const p = mount($('.screen', d), cam, true); p.start();
  const close = () => { p.stop(); d.remove(); removeEventListener('keydown', key); };
  const key = e => e.key === 'Escape' && close();
  $('.x', d).onclick = close; d.onclick = e => e.target === d && close();
  addEventListener('keydown', key);
  document.body.append(d); $('.x', d).focus();
}

async function load() {
  try {
    const r = await fetch(API, { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    const list = (j.state && j.state.cameras || []).filter(c => c.url);
    const s = JSON.stringify(list);
    if (s !== sig) { sig = s; cams = list; render(); }
    $('#upd').textContent = new Date().toLocaleTimeString('no-NO', { hour: '2-digit', minute: '2-digit' });
  } catch (e) {
    if (!cams.length) $('#count').textContent = 'Fikk ikke hentet kameralisten. Prøver igjen om et minutt.';
    setTimeout(load, 60000); return;
  }
}
load(); setInterval(load, 300000);
</script>
</body>
</html>
