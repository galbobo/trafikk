<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TRAFIKK</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%2319c8ff'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#070b11; --panel:#0d141d; --panel2:#111b27; --line:#1c2a3a; --txt:#d5e1ee; --mut:#7d8ea3;
  --acc:#19c8ff; --ok:#2ee6a6; --err:#ff4d5e; --warn:#ffb020; --off:#6b7a8c;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --tile-min: min(100%, 460px);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font:14px/1.4 var(--sans);display:grid;grid-template-rows:auto 1fr;height:100vh;height:100dvh;overflow:hidden}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 12px;transition:.15s;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--acc);color:#fff}
.btn.on{background:rgba(25,200,255,.14);border-color:var(--acc);color:#fff}
.btn.danger:hover{border-color:var(--err);color:var(--err)}

/* Header */
header.top{display:flex;align-items:center;gap:14px;padding:8px 16px;background:linear-gradient(#0f1823,#0a1119);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{width:24px;height:24px;border:2px solid var(--acc);border-radius:50%;position:relative;box-shadow:0 0 10px rgba(25,200,255,.5)}
.brand .logo::after{content:"";position:absolute;inset:5px;background:var(--acc);border-radius:50%}
.brand h1{font-size:16px;letter-spacing:.18em;text-transform:uppercase;font-weight:750;color:#fff}
.stats{display:flex;gap:6px;margin-left:6px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px 9px;font-family:var(--mono);font-size:12px;display:flex;gap:6px;align-items:center}
.stat i{width:7px;height:7px;border-radius:50%;display:inline-block}
.stat b{font-size:13px}
.spacer{flex:1}
.clock{text-align:right;font-family:var(--mono)}
.clock .t{font-size:18px;color:#fff;letter-spacing:.05em;line-height:1}
.clock .d{font-size:11px;color:var(--mut);text-transform:uppercase}
.actions{display:flex;gap:6px;flex-wrap:wrap}

/* Layout */
main{display:flex;position:relative;min-height:0;height:100%;overflow:hidden}

/* Map Drawer */
#mapPane{
  width: 420px;
  max-width: 90vw;
  background: var(--panel);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  position: relative;
  transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), margin-left 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  margin-left: -420px;
  z-index: 10;
}
#mapPane.open{
  margin-left: 0;
  box-shadow: 4px 0 24px rgba(0,0,0,.6);
}
#map{flex:1;min-height:0;background:#0b1118}
.map-header{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--panel2);border-bottom:1px solid var(--line)}
.map-header span{font-weight:600;font-size:13px;letter-spacing:.05em;text-transform:uppercase}
.mapbar{position:absolute;top:50px;left:10px;display:flex;gap:6px;z-index:5;flex-wrap:wrap;max-width:calc(100% - 20px)}
.mapbar .btn{background:rgba(13,20,29,.92);backdrop-filter:blur(4px)}
.maplegend{position:absolute;left:10px;bottom:10px;z-index:5;background:rgba(13,20,29,.92);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:11px;display:flex;gap:10px;flex-wrap:wrap}
.maplegend span{display:flex;gap:4px;align-items:center}
.maplegend i{width:8px;height:8px;border-radius:50%;display:inline-block}

/* Wall / Kameraområde */
#wallPane{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.walltools{display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{background:transparent;border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-size:12px;color:var(--mut)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#001018;font-weight:600}
.walltools input[type=search]{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 9px;width:170px}
.walltools select{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 8px}

/* Minimerte kamera-linje */
#minimizedBar{
  display:none;
  align-items:center;
  gap:8px;
  padding:6px 12px;
  background:#0a1017;
  border-bottom:1px solid var(--line);
  font-size:12px;
  overflow-x:auto;
  flex-wrap:nowrap;
}
#minimizedBar.has-items{display:flex}
.min-tag{
  background:var(--panel2);
  border:1px solid var(--line);
  padding:3px 8px;
  border-radius:4px;
  display:inline-flex;
  align-items:center;
  gap:6px;
  white-space:nowrap;
  color:var(--mut);
  cursor:pointer;
  transition:.15s;
}
.min-tag:hover{border-color:var(--acc);color:#fff}

#wall{
  flex:1;
  overflow-y:auto;
  padding:12px;
  display:grid;
  grid-template-columns: repeat(auto-fill, minmax(var(--tile-min), 1fr));
  gap:12px;
  align-content:start;
}
#wall:fullscreen {
  background: var(--bg);
  padding: 12px;
}

/* Fullskjerm: rutene fyller hele skjermen */
#wall.fs{
  overflow:hidden;
  grid-template-columns: repeat(var(--cols,1), minmax(0,1fr)) !important;
  grid-template-rows: repeat(var(--rows,1), minmax(0,1fr));
  align-content:stretch;
  gap:8px;
  padding:8px;
}
#wall.fs .tile{height:100%;min-height:0}
#wall.fs .media{aspect-ratio:auto;flex:1;min-height:0;height:auto}

/* Dynamisk skalering ved få kameraer */
#wall.count-1 { grid-template-columns: 1fr; }
#wall.count-2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 550px), 1fr)); }
#wall.count-3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); }
#wall.count-4 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); }

.empty{grid-column:1/-1;color:var(--mut);text-align:center;padding:60px 20px}

/* Flis (Tile) */
.tile{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:8px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  transition:border-color .2s, box-shadow .2s, opacity .2s;
  user-select:none;
}
.tile.dragging{opacity:0.35;border-style:dashed}
.tile.drag-over{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.tile.flash{border-color:var(--acc);box-shadow:0 0 0 2px rgba(25,200,255,.35),0 0 24px rgba(25,200,255,.25)}

.tile header{
  display:flex;align-items:center;gap:7px;padding:6px 10px;border-bottom:1px solid var(--line);min-height:34px;background:var(--panel2);
  cursor:grab;
}
.tile header:active{cursor:grabbing}
.drag-handle{color:var(--mut);font-size:14px;letter-spacing:-2px;margin-right:2px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--off);flex:none;box-shadow:0 0 6px currentColor;color:var(--off)}
.dot.ok{background:var(--ok);color:var(--ok)} .dot.error{background:var(--err);color:var(--err)} .dot.pending{background:var(--warn);color:var(--warn)}
.tile .name{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.badge{font-size:10px;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--line);color:var(--mut);padding:1px 5px;border-radius:4px;flex:none}
.badge.live{background:rgba(255,77,94,.15);border-color:var(--err);color:#ff7d8d;font-weight:600}
.ts{font-family:var(--mono);font-size:11px;color:var(--mut);flex:none}
.ib{background:none;border:0;color:var(--mut);padding:2px 6px;border-radius:4px;font-size:14px;line-height:1}
.ib:hover{color:#fff;background:var(--panel)}

.media{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
.media img,.media video,.media iframe{width:100%;height:100%;border:0;object-fit:cover;background:#000;display:block}
.media img.stale{opacity:.45;filter:grayscale(1)}
.ph{color:var(--mut);text-align:center;padding:14px;font-size:12px;display:flex;flex-direction:column;gap:6px;align-items:center}
.ph b{color:var(--txt);font-size:13px}
.offline-tag{position:absolute;left:8px;bottom:8px;background:rgba(255,77,94,.92);color:#fff;font-size:11px;padding:2px 8px;border-radius:4px;display:none;font-weight:600}
.media.err .offline-tag{display:block}

/* Fullscreen viewer */
#viewer{position:fixed;inset:0;background:#000;z-index:100;display:none;flex-direction:column}
#viewer.open{display:flex}
#viewer .vbar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:linear-gradient(rgba(0,0,0,.85),rgba(0,0,0,0));position:absolute;left:0;right:0;top:0;z-index:2;transition:opacity .4s}
#viewer .vbar h2{font-size:18px;font-weight:600}
#viewer .vbar .badge{font-size:11px}
#viewer .vfoot{position:absolute;left:0;right:0;bottom:0;padding:10px 16px;display:flex;gap:12px;align-items:center;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.85));z-index:2;transition:opacity .4s;font-family:var(--mono);color:var(--mut)}
#viewer.idle .vbar,#viewer.idle .vfoot,#viewer.idle .nav{opacity:0}
#viewer.idle{cursor:none}
#vmedia{flex:1;position:relative;display:grid;place-items:center}
#vmedia img,#vmedia video,#vmedia iframe{width:100%;height:100%;border:0;object-fit:contain;background:#000}
#viewer .nav{position:absolute;top:50%;transform:translateY(-50%);z-index:2;font-size:34px;background:rgba(13,20,29,.6);border:1px solid var(--line);border-radius:8px;padding:10px 14px;transition:opacity .4s}
#viewer .nav:hover{border-color:var(--acc)}
#viewer .prev{left:14px}#viewer .next{right:14px}

/* Dialog */
dialog{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:0;width:min(560px,94vw);box-shadow:0 20px 60px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(0,0,0,.65)}
dialog form{padding:18px;display:grid;gap:10px}
dialog h3{font-size:15px;letter-spacing:.06em;text-transform:uppercase}
dialog label{display:grid;gap:3px;font-size:12px;color:var(--mut)}
dialog input,dialog select{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;color:var(--txt)}
dialog .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
dialog .row3{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end}
dialog .hint{font-size:12px;color:var(--mut)}
dialog menu{display:flex;gap:8px;justify-content:flex-end;padding:0;margin-top:6px}

.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--acc);padding:8px 16px;border-radius:8px;z-index:200;display:none}
.lm{width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 6px rgba(0,0,0,.7)}

@media (max-width:980px){
  #mapPane{position:fixed;inset:0 auto 0 0;width:85vw;max-width:360px}
  .stats{display:none}
}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <div class="logo"></div>
    <div><h1>TRAFIKK</h1></div>
  </div>
  <div class="stats">
    <div class="stat"><i style="background:var(--acc)"></i>Totalt <b id="sTotal">0</b></div>
    <div class="stat"><i style="background:var(--ok)"></i>Online <b id="sOk">0</b></div>
    <div class="stat"><i style="background:var(--err)"></i>Feil <b id="sErr">0</b></div>
  </div>
  <div class="spacer"></div>
  <div class="actions">
    <button class="btn" id="btnToggleMap">🗺️ Kart</button>
    <button class="btn" id="btnAdd">＋ Kamera</button>
    <button class="btn" id="btnExport">Eksporter</button>
    <button class="btn" id="btnImport">Importer</button>
    <button class="btn danger" id="btnReset">Tilbakestill</button>
    <input type="file" id="fileImport" accept="application/json" hidden>
  </div>
  <div class="clock"><div class="t" id="clk">--:--:--</div><div class="d" id="clkd"></div></div>
</header>

<main>
  <aside id="mapPane">
    <div class="map-header">
      <span>Kartvisning</span>
      <button class="btn" id="btnCloseMap" style="padding:2px 8px">✕</button>
    </div>
    <div class="mapbar">
      <button class="btn on" id="btnTraffic">🚦 Trafikk</button>
      <button class="btn" id="btnSat">🛰 Satellitt</button>
      <button class="btn" id="btnFit">⤢ Vis alle</button>
    </div>
    <div id="map"></div>
    <div class="maplegend">
      <span><i style="background:var(--ok)"></i>Online</span>
      <span><i style="background:var(--err)"></i>Feil</span>
      <span><i style="background:var(--warn)"></i>Laster</span>
    </div>
  </aside>

  <section id="wallPane">
    <div class="walltools">
      <div class="chips" id="chips"></div>
      <input type="search" id="q" placeholder="Søk kamera …">
      <div class="spacer"></div>
      <label style="font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px">
        Størrelse:
        <select id="size">
          <option value="min(100%, 320px)">Kompakt</option>
          <option value="min(100%, 460px)" selected>Standard (Dynamisk)</option>
          <option value="min(100%, 650px)">Store ruter</option>
          <option value="100%">Full bredde (1 per rad)</option>
        </select>
      </label>
      <button class="btn" id="btnWallFs">⛶ Fullskjerm</button>
    </div>

    <!-- Menylinje for minimerte kameraer -->
    <div id="minimizedBar">
      <span style="color:var(--mut)">Legg til / Vis:</span>
      <div id="minimizedTags" style="display:flex;gap:6px;flex-wrap:wrap"></div>
      <button class="btn" id="btnRestoreAll" style="padding:2px 8px;font-size:11px;margin-left:auto">Vis alle</button>
    </div>

    <div id="wall"></div>
  </section>
</main>

<div id="viewer">
  <div class="vbar">
    <span class="dot" id="vdot"></span>
    <h2 id="vname"></h2><span class="badge" id="vsrc"></span>
    <div class="spacer"></div>
    <span class="ts" id="vcount"></span>
    <button class="btn" id="vclose">✕ Lukk (Esc)</button>
  </div>
  <button class="nav prev" id="vprev">‹</button>
  <div id="vmedia"></div>
  <button class="nav next" id="vnext">›</button>
  <div class="vfoot"><span id="vts"></span><span class="spacer"></span><span>← → bytt kamera</span></div>
</div>

<dialog id="editor">
  <form method="dialog" id="editForm">
    <h3 id="editTitle">Kamera</h3>
    <label>Navn<input id="fName" required placeholder="F.eks. E39 Forus"></label>
    <div class="row">
      <label>Kilde<select id="fSource"></select></label>
      <label>Type<select id="fType"></select></label>
    </div>
    <label>Strøm-URL / ID<input id="fUrl" placeholder="https://…"></label>
    <div class="hint" id="fHint"></div>
    <div class="row3">
      <label>Breddegrad<input id="fLat" type="number" step="any"></label>
      <label>Lengdegrad<input id="fLng" type="number" step="any"></label>
      <button type="button" class="btn" id="fPick">📍 I kart</button>
    </div>
    <div class="row">
      <label>Oppdatering (sek, bilde)<input id="fRef" type="number" min="3" placeholder="30"></label>
      <label>Kildeside (lenke)<input id="fPage" placeholder="https://…"></label>
    </div>
    <menu>
      <button type="button" class="btn danger" id="fDel">Slett</button>
      <span class="spacer"></span>
      <button type="button" class="btn" id="fCancel">Avbryt</button>
      <button type="submit" class="btn on" id="fSave" value="save">Lagre</button>
    </menu>
  </form>
</dialog>
<div class="toast" id="toast"></div>

<script>
const CONFIG = {
  GOOGLE_MAPS_API_KEY: "",
  MAP_CENTER: { lat: 58.97, lng: 5.73 },
  MAP_ZOOM: 10,
  DEFAULT_REFRESH_SEC: 30,
  RETRY_SEC: 30,
  STORAGE_KEY: "trafikk-kamera-v3",
  HIDDEN_STORAGE_KEY: "trafikk-hidden-cams"
};

/* Standard kameraliste */
const DEFAULT_CAMERAS = [
  {"id":"cam-01","name":"Fv509 – Kannik (vest)","source":"Aftenbladet","type":"hls","url":"https://svplive-lh.akamaized.net/hls/live/2039442/sa/Y8fGeD62y0DUM6JCpgm6P/master.m3u8","lat":58.966,"lng":5.725,"refresh":60},
  {"id":"cam-02","name":"Fv509 – Kannik (øst)","source":"Aftenbladet","type":"hls","url":"https://svplive-lh.akamaized.net/hls/live/msl5/20001089/sa_D2azfzV6IxSnseFDLooBu/source.m3u8","lat":58.967,"lng":5.728,"refresh":60},
  {"id":"cam-03","name":"Fv509 – Tjensvollkrysset","source":"Aftenbladet","type":"hls","url":"https://svplive-lh.akamaized.net/hls/live/2039446/sa/v9xFTOrfTvxvdp9AqwVSv/master.m3u8","lat":58.952,"lng":5.712,"refresh":60},
  {"id":"cam-04","name":"E39 – Kiellandsmyra 1","source":"Vegvesen","type":"hls","url":"https://kamera.vegvesen.no/public/1129038_1/hls_1_stream_1_orig.m3u8","lat":58.935,"lng":5.715,"refresh":60},
  {"id":"cam-05","name":"E39 – Kiellandsmyra 2","source":"Vegvesen","type":"hls","url":"https://kamera.vegvesen.no/public/1129038_2/hls_1_stream_1_orig.m3u8","lat":58.934,"lng":5.716,"refresh":60},
  {"id":"cam-06","name":"E39 – Forus 1 – mot Stavanger","source":"Vegvesen","type":"hls","url":"https://kamera.vegvesen.no/public/1129024_1/hls_1_stream_1_orig.m3u8","lat":58.888,"lng":5.717,"refresh":60},

  {"id":"cam-15","name":"Sandnes – Vågen","source":"Aftenbladet","type":"hls","url":"https://svplive-lh.akamaized.net/hls/live/msl5/20001089/sa_LIpi0Yh9hizlUH4ddVbYO/master.m3u8","lat":58.8517,"lng":5.733,"refresh":60},
  {"id":"cam-17","name":"Stavanger – Oljemuseet","source":"Aftenbladet","type":"hls","url":"https://svplive-lh.akamaized.net/hls/live/msl5/20001089/sa_DoIUz1MAI79XozrylNad2/master.m3u8","lat":58.9707,"lng":5.731,"refresh":60},
  {"id":"cam-08","name":"Rv509 – Solasplitten","source":"Vegvesen","type":"image","url":"https://kamera.atlas.vegvesen.no/api/images/1129032_1","lat":58.91,"lng":5.67,"refresh":30},
  {"id":"cam-09","name":"Fv441 – Sundekrossen – mot Stavanger","source":"Vegvesen","type":"image","url":"https://kamera.atlas.vegvesen.no/api/images/1129016_2","lat":58.975,"lng":5.63,"refresh":30},
  {"id":"cam-10","name":"Fv441 – Sundekrossen – mot Tananger","source":"Vegvesen","type":"image","url":"https://kamera.atlas.vegvesen.no/api/images/1129016_1","lat":58.974,"lng":5.63,"refresh":30},
  {"id":"cam-12","name":"E39 – Rennesøy","source":"Vegvesen","type":"image","url":"https://kamera.atlas.vegvesen.no/api/images/1129018_1","lat":59.09,"lng":5.7,"refresh":30},
  {"id":"cam-18","name":"Haugesund – Smedasundet","source":"Jatec","type":"image","url":"https://www.jatec.no/wp-content/uploads/Smedasundet/Smedasundet000M.jpg","lat":59.4105,"lng":5.2685,"refresh":60}
];

// De spesifikke kamera-ID-ene som skal være aktive som standard:
const DEFAULT_ACTIVE_IDS = new Set([
  "cam-01", // Fv509 – Kannik (vest)
  "cam-02", // Fv509 – Kannik (øst)
  "cam-03", // Fv509 – Tjensvollkrysset
  "cam-04", // E39 – Kiellandsmyra 1
  "cam-05", // E39 – Kiellandsmyra 2
  "cam-06", // E39 – Forus 1 – mot Stavanger
  "cam-07", // E39 – Forus 2 – mot Sandnes
  "cam-11", // E39 – Arsvågen ferjekai
  "cam-13", // E39 – Harestad – mot Stavanger
  "cam-14"  // Sandnes – Hanafjellet
]);

const SOURCES = ["Vegvesen","Aftenbladet","Jatec","YouTube","Annet"];
const TYPES = [["image","Stillbilde"], ["hls","HLS Video (.m3u8)"], ["video","Video (MP4)"], ["youtube","YouTube"]];
const TYPE_HINT = {
  image: "URL til stillbilde (oppdateres automatisk).",
  hls: "HLS videostrøm (.m3u8).",
  video: "Direkte MP4/WebM URL.",
  youtube: "YouTube video-ID eller direktesendingslenke."
};

const $ = (s, r=document) => r.querySelector(s);
const uid = () => "c-" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const fmtTime = d => d ? d.toLocaleTimeString("nb-NO",{timeZone:"Europe/Oslo",hour12:false}) : "–";
const STATUS_COLOR = { ok:"#2ee6a6", error:"#ff4d5e", pending:"#ffb020", unconfigured:"#6b7a8c" };

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.style.display="block"; clearTimeout(toast._t); toast._t=setTimeout(()=>t.style.display="none",3000); }
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
function loadCss(href){ const l=document.createElement("link"); l.rel="stylesheet"; l.href=href; document.head.appendChild(l); }

let cams = [];
let hiddenCams = new Set();
const status = {};
let filterSource = "Alle", filterText = "";
let draggedItem = null;

function isLiveType(t){ return t === "hls" || t === "video" || t === "youtube"; }

async function loadCams(){
  try{
    const saved = JSON.parse(localStorage.getItem(CONFIG.STORAGE_KEY));
    if (Array.isArray(saved) && saved.length > 0){ cams = saved; }
    else {
      cams = JSON.parse(JSON.stringify(DEFAULT_CAMERAS));
    }
  }catch(e){
    cams = JSON.parse(JSON.stringify(DEFAULT_CAMERAS));
  }

  // Last inn skjulte kameraer fra lagring, eller sett standard hvis det er første gang
  const savedHidden = localStorage.getItem(CONFIG.HIDDEN_STORAGE_KEY);
  if (savedHidden !== null){
    try{
      const h = JSON.parse(savedHidden);
      if (Array.isArray(h)) hiddenCams = new Set(h);
    }catch(e){}
  } else {
    // Kun de 10 definerte kameraene er aktive, resten skjules:
    hiddenCams = new Set(cams.filter(c => !DEFAULT_ACTIVE_IDS.has(c.id)).map(c => c.id));
    saveHidden();
  }
}

function saveCams(){
  try{ localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(cams)); }catch(e){}
}
function saveHidden(){
  try{ localStorage.setItem(CONFIG.HIDDEN_STORAGE_KEY, JSON.stringify([...hiddenCams])); }catch(e){}
}

function resolveUrl(cam){
  const u = (cam.url||"").trim();
  if (!u) return "";
  if (cam.type==="youtube"){
    const base = "https://www.youtube.com/embed/";
    const q = "autoplay=1&mute=1&playsinline=1&rel=0&modestbranding=1";
    const m = u.match(/(?:v=|youtu\.be\/|embed\/|live\/)([\w-]{11})/);
    return m ? `${base}${m[1]}?${q}` : u;
  }
  return u;
}

let hlsLoading = null;
function ensureHls(){ return hlsLoading || (hlsLoading = loadScript("https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.17/hls.min.js")); }

function mountMedia(cam, host, onStatus){
  const url = resolveUrl(cam);
  const timers = []; let hls = null, dead = false;
  const destroy = () => { dead = true; timers.forEach(clearInterval); timers.length=0; if (hls){ try{hls.destroy();}catch(e){} hls=null; } host.innerHTML=""; host.classList.remove("err"); };
  host.innerHTML = ""; host.classList.remove("err");
  if (!url){ onStatus("unconfigured"); return { destroy }; }

  const ok = () => { if(dead) return; host.classList.remove("err"); onStatus("ok", new Date()); };
  const bad = () => { if(dead) return; host.classList.add("err"); onStatus("error"); };
  const tag = () => { const t=document.createElement("div"); t.className="offline-tag"; t.textContent="Ingen signal"; host.append(t); };
  onStatus("pending");

  if (cam.type === "image"){
    const img = document.createElement("img"); img.alt = cam.name; host.append(img); tag();
    const tick = () => {
      const l = new Image(); const u = url + (url.includes("?")?"&":"?") + "_t=" + Date.now();
      l.onload = () => { if(dead) return; img.src = u; img.classList.remove("stale"); ok(); };
      l.onerror = () => { if(dead) return; img.classList.add("stale"); bad(); };
      l.src = u;
    };
    tick(); timers.push(setInterval(tick, Math.max(5, cam.refresh || CONFIG.DEFAULT_REFRESH_SEC) * 1000));
  } else if (cam.type === "hls" || cam.type === "video"){
    const v = document.createElement("video");
    v.muted = true; v.autoplay = true; v.loop = true; v.playsInline = true;
    v.setAttribute("muted",""); v.setAttribute("playsinline","");
    v.addEventListener("playing", ok); v.addEventListener("error", bad);
    host.append(v); tag();
    if (cam.type==="hls" && !v.canPlayType("application/vnd.apple.mpegurl")){
      ensureHls().then(() => {
        if (dead) return;
        if (!window.Hls || !Hls.isSupported()) return bad();
        hls = new Hls({ lowLatencyMode:true });
        hls.on(Hls.Events.ERROR, (_, d) => { if (d.fatal) bad(); });
        hls.loadSource(url); hls.attachMedia(v);
        v.play().catch(()=>{});
      }).catch(bad);
    } else { v.src = url; v.play().catch(()=>{}); }
  } else {
    const f = document.createElement("iframe");
    f.allow = "autoplay; encrypted-media"; f.src = url;
    f.onload = ok; f.onerror = bad; host.append(f); tag();
  }
  return { destroy };
}

const wall = $("#wall");
const tiles = new Map();

function setStatus(id, s, t){
  if (s==="ok") status[id] = { s, t }; else status[id] = { s, t: status[id]?.t };
  const tl = tiles.get(id);
  if (tl){
    tl.el.querySelector(".dot").className = "dot " + (s==="unconfigured"?"":s);
    tl.el.querySelector(".ts").textContent = status[id].t ? fmtTime(status[id].t) : "";
  }
  mapApi && mapApi.setStatus(id, s);
  refreshStats();
}

function startTile(cam){
  const tl = tiles.get(cam.id); if (!tl) return;
  tl.mount && tl.mount.destroy(); clearTimeout(tl.retry);
  tl.mount = mountMedia(cam, tl.el.querySelector(".media"), (s,t) => {
    setStatus(cam.id, s, t);
    if (s==="error" && cam.type!=="image"){ clearTimeout(tl.retry); tl.retry = setTimeout(()=>startTile(cam), CONFIG.RETRY_SEC*1000); }
  });
}

function buildTile(cam){
  const el = document.createElement("article");
  el.className = "tile"; el.dataset.id = cam.id;
  el.draggable = true;

  const isLive = isLiveType(cam.type);
  el.innerHTML = `
    <header>
      <span class="drag-handle" title="Dra for å flytte">⋮⋮</span>
      <span class="dot"></span>
      <span class="name" title="${cam.name}">${cam.name}</span>
      <span class="badge ${isLive ? 'live' : ''}">${isLive ? 'LIVE' : cam.source}</span>
      <span class="ts"></span>
      <button class="ib hide-btn" title="Minimer / Skjul kamera">👁️</button>
      <button class="ib loc" title="Vis i kart">⌖</button>
      <button class="ib edit" title="Rediger">✎</button>
      <button class="ib fs" title="Fullskjerm">⛶</button>
    </header>
    <div class="media"></div>`;

  el.addEventListener("dragstart", e => {
    draggedItem = el;
    el.classList.add("dragging");
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", cam.id);
  });
  el.addEventListener("dragend", () => {
    el.classList.remove("dragging");
    document.querySelectorAll(".tile").forEach(t => t.classList.remove("drag-over"));
  });
  el.addEventListener("dragover", e => {
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    if (draggedItem !== el) el.classList.add("drag-over");
  });
  el.addEventListener("dragleave", () => el.classList.remove("drag-over"));
  el.addEventListener("drop", e => {
    e.preventDefault();
    el.classList.remove("drag-over");
    if (!draggedItem || draggedItem === el) return;

    const fromId = draggedItem.dataset.id;
    const toId = el.dataset.id;
    const fromIdx = cams.findIndex(c => c.id === fromId);
    const toIdx = cams.findIndex(c => c.id === toId);

    if (fromIdx !== -1 && toIdx !== -1){
      const [moved] = cams.splice(fromIdx, 1);
      cams.splice(toIdx, 0, moved);
      saveCams();
      renderWall();
    }
  });

  el.querySelector(".hide-btn").onclick = () => hideCamera(cam.id);
  el.querySelector(".fs").onclick = () => openViewer(cam.id);
  el.querySelector(".edit").onclick = () => openEditor(cam.id);
  el.querySelector(".loc").onclick = () => {
    if (cam.lat!=null && cam.lng!=null){
      toggleMap(true);
      setTimeout(() => mapApi && mapApi.focus(cam.id), 260);
    } else {
      toast("Kameraet mangler posisjon i kart");
    }
  };
  el.querySelector(".media").addEventListener("dblclick", () => openViewer(cam.id));
  return el;
}

function hideCamera(id){
  hiddenCams.add(id);
  saveHidden();
  applyFilter();
  toast("Kamera minimert (kan legges til fra toppen)");
}

function restoreCamera(id){
  hiddenCams.delete(id);
  saveHidden();
  applyFilter();
}

$("#btnRestoreAll").onclick = () => {
  hiddenCams.clear();
  saveHidden();
  applyFilter();
};

function renderMinimizedBar(){
  const bar = $("#minimizedBar");
  const list = $("#minimizedTags");
  list.innerHTML = "";

  const hiddenList = cams.filter(c => hiddenCams.has(c.id));
  if (hiddenList.length === 0){
    bar.classList.remove("has-items");
    return;
  }
  bar.classList.add("has-items");
  hiddenList.forEach(c => {
    const tag = document.createElement("span");
    tag.className = "min-tag";
    tag.title = "Klikk for å aktivere i visningen";
    tag.innerHTML = `<span>＋ ${c.name}</span>`;
    tag.onclick = () => restoreCamera(c.id);
    list.append(tag);
  });
}

function updateWallLayoutClass(visibleCount){
  wall.classList.remove("count-1", "count-2", "count-3", "count-4");
  if ($("#size").value === "100%") return;
  if (visibleCount === 1) wall.classList.add("count-1");
  else if (visibleCount === 2) wall.classList.add("count-2");
  else if (visibleCount === 3) wall.classList.add("count-3");
  else if (visibleCount === 4) wall.classList.add("count-4");
}

function renderWall(){
  tiles.forEach(t => { t.mount && t.mount.destroy(); clearTimeout(t.retry); });
  tiles.clear();
  wall.innerHTML = "";
  if (!cams.length){
    wall.innerHTML = '<div class="empty">Ingen kameraer lagt til.</div>';
    updateWallLayoutClass(0);
    return;
  }
  cams.forEach(cam => {
    const el = buildTile(cam);
    wall.append(el);
    tiles.set(cam.id, { el });
  });
  buildChips();
  applyFilter();
  cams.forEach(startTile);
  refreshStats();
}

function visibleCams(){
  const q = filterText.toLowerCase();
  return cams.filter(c => 
    !hiddenCams.has(c.id) &&
    (filterSource==="Alle" || c.source===filterSource) && 
    (!q || (c.name+" "+c.source).toLowerCase().includes(q))
  );
}

function applyFilter(){
  const vis = new Set(visibleCams().map(c=>c.id));
  tiles.forEach((t,id) => t.el.style.display = vis.has(id) ? "" : "none");
  updateWallLayoutClass(vis.size);
  renderMinimizedBar();
  mapApi && mapApi.setVisible && mapApi.setVisible(vis);
  layoutFs();
}

function buildChips(){
  const box = $("#chips"); box.innerHTML = "";
  const present = ["Alle", ...SOURCES.filter(s => cams.some(c=>c.source===s))];
  present.forEach(s => {
    const b = document.createElement("button"); b.className = "chip" + (s===filterSource?" on":""); b.textContent = s;
    b.onclick = () => { filterSource = s; buildChips(); applyFilter(); };
    box.append(b);
  });
}
function refreshStats(){
  $("#sTotal").textContent = cams.length;
  $("#sOk").textContent = cams.filter(c=>status[c.id]?.s==="ok").length;
  $("#sErr").textContent = cams.filter(c=>status[c.id]?.s==="error").length;
}

/* Fullscreen Viewer */
const viewer = $("#viewer"); let viewerCam = null, viewerMount = null, viewerList = [], idleT;
function openViewer(id){
  viewerList = visibleCams(); if (!viewerList.some(c=>c.id===id)) viewerList = cams.slice();
  viewer.classList.add("open"); showViewer(id);
  viewer.requestFullscreen?.().catch(()=>{});
  wakeViewer();
}
function showViewer(id){
  viewerMount && viewerMount.destroy();
  viewerCam = viewerList.find(c=>c.id===id) || viewerList[0];
  $("#vname").textContent = viewerCam.name; $("#vsrc").textContent = viewerCam.source;
  $("#vcount").textContent = (viewerList.indexOf(viewerCam)+1) + " / " + viewerList.length;
  viewerMount = mountMedia(viewerCam, $("#vmedia"), (s,t) => { if(s==="ok") status[viewerCam.id]={s,t}; updateViewerStatus(s); });
}
function updateViewerStatus(s){
  const st = s || status[viewerCam.id]?.s || "pending";
  $("#vdot").className = "dot " + (st==="unconfigured"?"":st);
  $("#vts").textContent = "Siste oppdatering: " + fmtTime(status[viewerCam.id]?.t);
}
function stepViewer(d){
  const i = viewerList.indexOf(viewerCam);
  showViewer(viewerList[(i+d+viewerList.length)%viewerList.length].id);
}
function closeViewer(){
  if (!viewer.classList.contains("open")) return;
  viewerMount && viewerMount.destroy(); viewerMount = null; viewerCam = null;
  viewer.classList.remove("open");
  if (document.fullscreenElement===viewer) document.exitFullscreen().catch(()=>{});
}
function wakeViewer(){ viewer.classList.remove("idle"); clearTimeout(idleT); idleT = setTimeout(()=>viewer.classList.add("idle"), 3000); }
viewer.addEventListener("mousemove", wakeViewer); viewer.addEventListener("click", wakeViewer);
$("#vclose").onclick = closeViewer; $("#vprev").onclick = ()=>stepViewer(-1); $("#vnext").onclick = ()=>stepViewer(1);
document.addEventListener("keydown", e => {
  if (viewer.classList.contains("open")){
    if (e.key==="Escape") closeViewer();
    else if (e.key==="ArrowRight") stepViewer(1);
    else if (e.key==="ArrowLeft") stepViewer(-1);
    wakeViewer();
  }
});

/* Kart */
let mapApi = null;
const mapPane = $("#mapPane");

function toggleMap(forceOpen){
  const isOpen = mapPane.classList.contains("open");
  const open = forceOpen !== undefined ? forceOpen : !isOpen;
  mapPane.classList.toggle("open", open);
  $("#btnToggleMap").classList.toggle("on", open);
  if (open && mapApi && mapApi.fit){
    setTimeout(() => { mapApi.invalidateSize?.(); }, 250);
  }
}
$("#btnToggleMap").onclick = () => toggleMap();
$("#btnCloseMap").onclick = () => toggleMap(false);

function popupEl(cam){
  const d = document.createElement("div");
  d.innerHTML = `<b>${cam.name}</b><br><small>${cam.source}</small><br>
    <button style="margin-top:6px;background:var(--acc);color:#000;border:0;padding:4px 8px;border-radius:4px;font-weight:600;cursor:pointer">Åpne</button>`;
  d.querySelector("button").onclick = () => openViewer(cam.id);
  return d;
}

function leafletMapApi(){
  const map = L.map("map", { zoomControl:true }).setView([CONFIG.MAP_CENTER.lat, CONFIG.MAP_CENTER.lng], CONFIG.MAP_ZOOM);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom:19, attribution:"© OpenStreetMap" }).addTo(map);
  const markers = new Map();
  const mk = s => L.divIcon({ className:"", html:`<div class="lm" style="background:${STATUS_COLOR[s]||STATUS_COLOR.pending}"></div>`, iconSize:[14,14], iconAnchor:[7,7] });

  return {
    kind:"leaflet",
    invalidateSize(){ map.invalidateSize(); },
    add(cam){
      if (cam.lat==null || cam.lng==null || cam.lat==="") return;
      const m = L.marker([+cam.lat,+cam.lng], { icon: mk(status[cam.id]?.s), title:cam.name }).addTo(map);
      m.bindPopup(() => popupEl(cam));
      markers.set(cam.id, m);
    },
    clear(){ markers.forEach(m=>m.remove()); markers.clear(); },
    setStatus(id,s){ markers.get(id)?.setIcon(mk(s)); },
    setVisible(set){ markers.forEach((m,id)=> set.has(id) ? m.addTo(map) : m.remove()); },
    focus(id){
      const m=markers.get(id); if(!m) return;
      map.setView(m.getLatLng(), 13); m.openPopup();
    },
    fit(){
      const pts=[...markers.values()].map(m=>m.getLatLng());
      if(pts.length) map.fitBounds(L.latLngBounds(pts).pad(.2));
      else map.setView([CONFIG.MAP_CENTER.lat,CONFIG.MAP_CENTER.lng],CONFIG.MAP_ZOOM);
    }
  };
}

async function initMap(){
  loadCss("https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css");
  await loadScript("https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js");
  mapApi = leafletMapApi();
  cams.forEach(c => mapApi.add(c));
  mapApi.fit();
}

$("#btnFit").onclick = () => mapApi && mapApi.fit();

/* Editor */
const dlg = $("#editor"); let editId = null;
SOURCES.forEach(s => $("#fSource").add(new Option(s,s)));
TYPES.forEach(([v,l]) => $("#fType").add(new Option(l,v)));
$("#fType").onchange = () => $("#fHint").textContent = TYPE_HINT[$("#fType").value];

function openEditor(id){
  editId = id || null;
  const c = id ? cams.find(x=>x.id===id) : { name:"", source:"Vegvesen", type:"hls", url:"", lat:"", lng:"", refresh:"", page:"" };
  $("#editTitle").textContent = id ? "Rediger kamera" : "Nytt kamera";
  $("#fName").value=c.name; $("#fSource").value=c.source; $("#fType").value=c.type; $("#fUrl").value=c.url||"";
  $("#fLat").value=c.lat??""; $("#fLng").value=c.lng??""; $("#fRef").value=c.refresh||""; $("#fPage").value=c.page||"";
  $("#fDel").style.display = id ? "" : "none"; $("#fType").onchange();
  dlg.showModal();
}
$("#btnAdd").onclick = () => openEditor();
$("#fCancel").onclick = () => dlg.close();
$("#editForm").addEventListener("submit", e => {
  e.preventDefault();
  const num = v => v==="" ? null : +v;
  const data = {
    name:$("#fName").value.trim(), source:$("#fSource").value, type:$("#fType").value, url:$("#fUrl").value.trim(),
    lat:num($("#fLat").value), lng:num($("#fLng").value), refresh:num($("#fRef").value)||undefined, page:$("#fPage").value.trim()||undefined
  };
  if (editId){ Object.assign(cams.find(c=>c.id===editId), data); }
  else { cams.unshift({ id:uid(), ...data }); }
  dlg.close(); saveCams(); renderWall();
  if (mapApi){ mapApi.clear(); cams.forEach(c=>mapApi.add(c)); }
});
$("#fDel").onclick = () => {
  if (confirm("Slette dette kameraet?")){
    cams = cams.filter(c=>c.id!==editId); dlg.close(); saveCams(); renderWall();
    if (mapApi){ mapApi.clear(); cams.forEach(c=>mapApi.add(c)); }
  }
};

/* Import / Eksport */
$("#btnExport").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(cams,null,2)],{type:"application/json"}));
  a.download = "trafikk_kameraer.json"; a.click();
};
$("#btnImport").onclick = () => $("#fileImport").click();
$("#fileImport").onchange = async e => {
  const f = e.target.files[0]; if(!f) return;
  try{
    const arr = JSON.parse(await f.text());
    if (Array.isArray(arr)){ cams = arr; saveCams(); renderWall(); toast(`Importerte ${arr.length} kameraer`); }
  }catch(err){ toast("Ugyldig fil"); }
  e.target.value = "";
};
$("#btnReset").onclick = () => {
  if (confirm("Nullstille kameraer og rekkefølge?")){ 
    localStorage.removeItem(CONFIG.STORAGE_KEY); 
    localStorage.removeItem(CONFIG.HIDDEN_STORAGE_KEY);
    location.reload(); 
  }
};

/* Verktøy */
$("#q").addEventListener("input", e => { filterText = e.target.value; applyFilter(); });
$("#size").onchange = e => {
  document.documentElement.style.setProperty("--tile-min", e.target.value);
  applyFilter();
};

/* Auto-tilpasning av ruter i fullskjerm */
function layoutFs(){
  if (document.fullscreenElement !== wall){ wall.classList.remove("fs"); return; }
  wall.classList.add("fs");
  const n = [...tiles.values()].filter(t => t.el.style.display !== "none").length;
  if (!n) return;
  const cs = getComputedStyle(wall);
  const gap = parseFloat(cs.columnGap) || 8;
  const W = wall.clientWidth  - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const H = wall.clientHeight - parseFloat(cs.paddingTop)  - parseFloat(cs.paddingBottom);
  const HEADER = 35;            // høyde på flis-header
  let best = {cols:1, score:Infinity};
  for (let cols = 1; cols <= n; cols++){
    const rows = Math.ceil(n / cols);
    const cw = (W - gap*(cols-1)) / cols;
    const ch = (H - gap*(rows-1)) / rows - HEADER;
    if (cw <= 0 || ch <= 0) continue;
    // Velg oppsettet der bildeformatet ligger nærmest 16:9 (minst beskjæring)
    const score = Math.abs(Math.log((cw/ch) / (16/9)));
    if (score < best.score) best = { cols, score };
  }
  wall.style.setProperty("--cols", best.cols);
  wall.style.setProperty("--rows", Math.ceil(n / best.cols));
}
document.addEventListener("fullscreenchange", () => requestAnimationFrame(layoutFs));
window.addEventListener("resize", layoutFs);

/* Fullskjerm kun for veggen (#wall), skjuler menyer */
$("#btnWallFs").onclick = () => {
  if (document.fullscreenElement) {
    document.exitFullscreen();
  } else {
    wall.requestFullscreen?.().catch(() => toast("Fullskjerm ikke tilgjengelig"));
  }
};

function tickClock(){
  const n = new Date();
  $("#clk").textContent = n.toLocaleTimeString("nb-NO",{timeZone:"Europe/Oslo",hour12:false});
  $("#clkd").textContent = n.toLocaleDateString("nb-NO",{timeZone:"Europe/Oslo",weekday:"short",day:"2-digit",month:"short"});
}
setInterval(tickClock,1000); tickClock();

(async function boot(){
  await loadCams();
  renderWall();
  await initMap();
})();
