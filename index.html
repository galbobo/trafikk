<!DOCTYPE html>
<html lang="no" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sør-Vest Trafikk & Kameraovervåking</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>
<script>
tailwind.config = { darkMode: 'class', theme: { extend: { colors: { ops: { bg:'#090D16', panel:'#111827', card:'#161F33', border:'#1E293B' } } } } }
</script>
<style>
body { background:#090D16; color:#F8FAFC; font-family:system-ui,-apple-system,'Segoe UI',sans-serif; }
.leaflet-container { background:#0B111E !important; }
.leaflet-popup-content-wrapper, .leaflet-popup-tip { background:#111827 !important; color:#F8FAFC !important; }
.custom-marker { display:flex; align-items:center; justify-content:center; border-radius:9999px; box-shadow:0 0 12px rgba(0,0,0,.65); }
</style>
</head>
<body class="min-h-screen flex flex-col">

<header class="sticky top-0 z-40 bg-ops-bg/95 backdrop-blur border-b border-ops-border px-4 lg:px-6 py-3">
  <div class="max-w-[1920px] mx-auto flex flex-wrap items-center justify-between gap-3">
    <div>
      <h1 class="font-bold text-lg sm:text-xl text-white">SØR-VEST TRAFIKK & KAMERAOVERSIKT</h1>
      <p class="text-xs text-slate-400">Direktestrømmer og kameranoder i Sør-Vest</p>
    </div>
    <div class="flex flex-wrap items-center gap-3 text-xs">
      <div class="bg-ops-panel border border-ops-border rounded-lg px-3 py-1.5">
        <span class="text-slate-400">I kartutsnitt:</span> <b id="viewportCountBadge" class="text-white">0</b>
      </div>
      <button onclick="zoomToRegion('all')" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 px-3 py-1.5 rounded-lg">🌍 Vis hele Sør-Vest</button>
      <span id="liveClock" class="font-mono text-sky-400">--:--:--</span>
    </div>
  </div>
</header>

<main class="flex-1 max-w-[1920px] w-full mx-auto px-4 lg:px-6 py-4 space-y-6">
  <section class="grid grid-cols-1 lg:grid-cols-12 gap-4">
    <div class="lg:col-span-8 bg-ops-panel border border-ops-border rounded-2xl overflow-hidden">
      <div class="p-3 bg-slate-900/90 border-b border-ops-border flex items-center gap-2 text-xs">
        <span class="font-semibold uppercase text-slate-400">Kartlag:</span>
        <button onclick="setMapLayer('streets')" id="btnLayerStreets" class="px-2.5 py-1 rounded bg-sky-500 text-slate-950 font-semibold">🗺️ Veikart</button>
        <button onclick="setMapLayer('satellite')" id="btnLayerSat" class="px-2.5 py-1 rounded bg-slate-800 text-slate-300 hover:bg-slate-700">🛰️ Satellitt</button>
      </div>
      <div class="relative h-[380px] sm:h-[430px] w-full">
        <div id="map" class="w-full h-full z-10"></div>
        <div id="bboxCoordsText" class="absolute bottom-3 left-3 z-20 bg-slate-950/90 border border-slate-700 rounded-xl px-3 py-2 text-xs font-mono text-slate-300 pointer-events-none"></div>
      </div>
    </div>

    <div class="lg:col-span-4 bg-ops-panel border border-ops-border rounded-2xl p-4 space-y-4">
      <h2 class="font-bold text-white border-b border-ops-border pb-3">OMRÅDER & FILTRE</h2>
      <div class="grid grid-cols-2 gap-2 text-xs">
        <button onclick="zoomToRegion('nordjæren')" class="px-3 py-2 rounded-lg bg-slate-800 hover:bg-sky-500/20 border border-slate-700 text-left">🏙️ Stavanger / Sandnes</button>
        <button onclick="zoomToRegion('haugalandet')" class="px-3 py-2 rounded-lg bg-slate-800 hover:bg-sky-500/20 border border-slate-700 text-left">🌉 Haugesund / Karmøy</button>
        <button onclick="zoomToRegion('jæren')" class="px-3 py-2 rounded-lg bg-slate-800 hover:bg-sky-500/20 border border-slate-700 text-left">🛣️ Jæren / Egersund</button>
        <button onclick="zoomToRegion('sirdal')" class="px-3 py-2 rounded-lg bg-slate-800 hover:bg-sky-500/20 border border-slate-700 text-left">❄️ Sirdal / Hunnedalen</button>
      </div>
      <input type="text" id="searchInput" oninput="applyFilters()" placeholder="Søk vei (E39, E134) eller sted..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white outline-none focus:border-sky-400" />
      <div class="flex flex-wrap gap-1.5 text-xs" id="catButtons">
        <button data-cat="ALL" onclick="setCategory('ALL')">Alle</button>
        <button data-cat="HOVEDVEI" onclick="setCategory('HOVEDVEI')">🛣️ Hovedvei</button>
        <button data-cat="FJELL" onclick="setCategory('FJELL')">❄️ Fjell</button>
        <button data-cat="ANDRE" onclick="setCategory('ANDRE')">⚓ Havn & By</button>
      </div>
      <div class="pt-3 border-t border-ops-border text-right text-xs">
        <button onclick="refreshCameras()" class="text-sky-400 hover:text-sky-300 font-semibold">🔄 Last strømmer på nytt</button>
      </div>
    </div>
  </section>

  <section class="space-y-3 pb-12">
    <div class="flex items-center justify-between border-b border-ops-border pb-2.5">
      <h2 class="font-bold text-white">KAMERANODER I KARTUTSNITT</h2>
      <span id="gridCountBadge" class="px-2 py-0.5 text-xs font-mono font-bold rounded bg-sky-500/20 text-sky-400">0</span>
    </div>
    <div id="cameraGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4"></div>
  </section>
</main>

<script>
// ---------- KONFIG ----------
const MAX_AUTOPLAY = 8; // maks antall strømmer som starter av seg selv (resten får en spill-av-knapp)

// C(id, navn, vei, kommune, lat, lng, kategori, streamUrl)
// Legg inn .m3u8-adressen som siste verdi for å få direktestrøm.
// lat/lng = null gir et kort som alltid vises (uavhengig av kartutsnitt).
const C = (id, name, road, municipality, lat, lng, category, streamUrl = '') =>
  ({ id, name, road, municipality, lat, lng, category, streamUrl });

const CAMERAS = [
  C('v1',  'Vegvesen kamera 1129024_2', 'Vegvesen', 'Posisjon ikke satt', null, null, 'HOVEDVEI',
    'https://kamera.vegvesen.no/public/1129024_2/hls_1_stream_1_orig.m3u8'),
  C('c1',  'E39 Lura / Forus',                'E39',   'Sandnes',            58.8861, 5.7330, 'HOVEDVEI'),
  C('c2',  'E39 Ålgård / Figgjo',             'E39',   'Gjesdal',            58.7654, 5.8542, 'HOVEDVEI'),
  C('c3',  'Fv450 Hunnedalen',                'Fv450', 'Gjesdal / Sirdal',   58.8260, 6.3950, 'FJELL'),
  C('c4',  'E39 Mortavika Ferjekai',          'E39',   'Stavanger',          59.1422, 5.5880, 'HOVEDVEI'),
  C('c5',  'E39 Mekjarvik / Byfjordtunnelen', 'E39',   'Randaberg',          59.0221, 5.6224, 'HOVEDVEI'),
  C('c6',  'Rv509 Sola / Flyplassveien',      'Rv509', 'Sola',               58.8870, 5.6020, 'HOVEDVEI'),
  C('c7',  'Rv13 Ryfast / Solbakk',           'Rv13',  'Strand',             59.0185, 5.9510, 'HOVEDVEI'),
  C('c8',  'E39 Bue / Vikeså',                'E39',   'Bjerkreim',          58.6380, 6.0850, 'HOVEDVEI'),
  C('c9',  'E39 Helleland',                   'E39',   'Eigersund',          58.5240, 6.2350, 'HOVEDVEI'),
  C('c10', 'Fv44 Jærveien / Bryne',           'Fv44',  'Time',               58.7358, 5.6475, 'HOVEDVEI'),
  C('c11', 'E39 Arsvågen Ferjekai',           'E39',   'Bokn',               59.1705, 5.4510, 'HOVEDVEI'),
  C('c12', 'E134 Aksdal Knutepunkt',          'E134',  'Tysvær',             59.4230, 5.4620, 'HOVEDVEI'),
  C('c13', 'Fv547 Karmsund bru',              'Fv547', 'Haugesund / Karmøy', 59.3765, 5.2950, 'HOVEDVEI'),
  C('c14', 'Rv13 Bratlandsdalen',             'Rv13',  'Suldal',             59.6220, 6.7910, 'FJELL'),
  C('c15', 'Fv520 Saudafjellet',              'Fv520', 'Sauda',              59.6850, 6.4820, 'FJELL'),
  C('c16', 'E134 Langfossen / Rullestad',     'E134',  'Etne',               59.8450, 6.3380, 'FJELL'),
  C('c17', 'Stavanger Vågen / Byfjorden',     'Bykamera', 'Stavanger',       58.9775, 5.7165, 'ANDRE'),
  C('c18', 'Sandnes havn / Vågen',            'Bykamera', 'Sandnes',         58.8520, 5.7350, 'ANDRE')
];

// ---------- TILSTAND ----------
let map, baseLayer, trafficLayer, markerGroup;
let selectedCategory = 'ALL';
let lastKey = null;
const players = new Map(); // id -> Hls-instans
let debounceTimer;

const TILES = {
  streets:   'https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}',
  satellite: 'https://mt1.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}'
};
const ON = 'px-2.5 py-1 rounded-lg font-semibold bg-sky-500 text-slate-950';
const OFF = 'px-2.5 py-1 rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700';

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const detailUrl = cam => cam.lat == null ? 'https://trafikk.vegvesen.no/' :
  `https://trafikk.vegvesen.no/?lat=${cam.lat}&lon=${cam.lng}&zoom=14`;

// ---------- KART ----------
function initMap() {
  map = L.map('map', { center: [59.05, 5.85], zoom: 8 });
  baseLayer = L.tileLayer(TILES.streets, { maxZoom: 20, attribution: '&copy; Google' }).addTo(map);
  trafficLayer = L.tileLayer('https://mt1.google.com/vt/lyrs=h,traffic&x={x}&y={y}&z={z}', { maxZoom: 20, opacity: .9 }).addTo(map);
  markerGroup = L.layerGroup().addTo(map);
  // moveend dekker også zoomend; debounce hindrer at strømmene startes om igjen under panorering
  map.on('moveend', () => { updateBbox(); clearTimeout(debounceTimer); debounceTimer = setTimeout(applyFilters, 300); });
  updateBbox();
}

function setMapLayer(type) {
  map.removeLayer(baseLayer);
  baseLayer = L.tileLayer(TILES[type], { maxZoom: 20 }).addTo(map);
  baseLayer.bringToBack();
  document.getElementById('btnLayerStreets').className = (type === 'streets' ? ON : OFF) + ' text-xs';
  document.getElementById('btnLayerSat').className = (type === 'satellite' ? ON : OFF) + ' text-xs';
}

function zoomToRegion(r) {
  const t = {
    all: [[59.05, 5.85], 8], nordjæren: [[58.93, 5.71], 11], haugalandet: [[59.39, 5.38], 11],
    jæren: [[58.63, 5.90], 10], sirdal: [[58.83, 6.42], 10]
  }[r] || [[59.05, 5.85], 8];
  map.flyTo(t[0], t[1], { duration: .7 });
}

function updateBbox() {
  const b = map.getBounds();
  document.getElementById('bboxCoordsText').textContent = `${b.getSouth().toFixed(2)}°N – ${b.getNorth().toFixed(2)}°N`;
}

function setCategory(cat) {
  selectedCategory = cat;
  document.querySelectorAll('#catButtons button').forEach(b => b.className = b.dataset.cat === cat ? ON : OFF);
  applyFilters();
}

// ---------- AVSPILLING ----------
function setStatus(id, state) {
  const el = document.getElementById('status-' + id);
  if (!el) return;
  const m = { loading: ['Laster…', 'text-slate-400'], live: ['● Live', 'text-emerald-400'],
              error: ['Feil', 'text-red-400'], none: ['Ingen strøm', 'text-slate-500'] }[state];
  el.textContent = m[0];
  el.className = 'font-mono ' + m[1];
}

function destroyPlayers() {
  players.forEach(h => h.destroy());
  players.clear();
}

function mountPlayer(cam, auto) {
  const mount = document.getElementById('player-' + cam.id);
  if (!mount) return;

  if (!cam.streamUrl) {
    setStatus(cam.id, 'none');
    mount.innerHTML = `<div class="absolute inset-0 flex flex-col items-center justify-center gap-2 text-center p-3">
      <p class="text-xs text-slate-400">Ingen direktestrøm lagt inn</p>
      <a href="${esc(detailUrl(cam))}" target="_blank" rel="noopener" class="px-3 py-1.5 rounded-lg bg-sky-500 text-slate-950 font-semibold text-xs">Åpne på trafikk.vegvesen.no ↗</a></div>`;
    return;
  }

  if (!auto) {
    setStatus(cam.id, 'none');
    mount.innerHTML = `<button class="absolute inset-0 w-full text-sm text-sky-300 hover:bg-slate-900">▶ Spill av</button>`;
    mount.firstElementChild.onclick = () => { setStatus(cam.id, 'loading'); mountPlayer(cam, true); };
    return;
  }

  setStatus(cam.id, 'loading');
  const video = document.createElement('video');
  video.className = 'w-full h-full object-cover bg-black';
  video.muted = true;          // påkrevd for at nettleseren skal tillate autoplay
  video.defaultMuted = true;
  video.autoplay = true;
  video.playsInline = true;
  video.controls = true;
  mount.replaceChildren(video);

  const play = () => { video.play().catch(() => {}); setStatus(cam.id, 'live'); };
  const fail = () => {
    setStatus(cam.id, 'error');
    mount.innerHTML = `<div class="absolute inset-0 flex flex-col items-center justify-center gap-2 text-center p-3">
      <p class="text-xs text-slate-300">Strømmen kunne ikke lastes (nettverk eller CORS-blokkering).</p>
      <a href="${esc(detailUrl(cam))}" target="_blank" rel="noopener" class="px-3 py-1.5 rounded-lg bg-sky-500 text-slate-950 font-semibold text-xs">Åpne kamera ↗</a></div>`;
  };

  if (window.Hls && Hls.isSupported()) {
    const hls = new Hls({ lowLatencyMode: true, backBufferLength: 30 });
    players.set(cam.id, hls);
    let retries = 0;
    hls.on(Hls.Events.MANIFEST_PARSED, play);
    hls.on(Hls.Events.ERROR, (_, d) => {
      if (!d.fatal) return;
      if (d.type === Hls.ErrorTypes.NETWORK_ERROR && retries++ < 3) hls.startLoad();
      else if (d.type === Hls.ErrorTypes.MEDIA_ERROR && retries++ < 3) hls.recoverMediaError();
      else { hls.destroy(); players.delete(cam.id); fail(); }
    });
    hls.loadSource(cam.streamUrl);
    hls.attachMedia(video);
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = cam.streamUrl; // Safari/iOS spiller HLS direkte
    video.addEventListener('loadedmetadata', play);
    video.addEventListener('error', fail);
  } else {
    fail();
  }
}

// ---------- FILTER + GRID ----------
function applyFilters() {
  if (!map) return;
  const bounds = map.getBounds();
  const q = document.getElementById('searchInput').value.trim().toLowerCase();

  const visible = CAMERAS.filter(c =>
    (c.lat == null || bounds.contains([c.lat, c.lng])) &&
    (selectedCategory === 'ALL' || c.category === selectedCategory) &&
    (!q || [c.name, c.road, c.municipality].some(s => s.toLowerCase().includes(q)))
  ).sort((a, b) => !!b.streamUrl - !!a.streamUrl); // kameraer med strøm først

  document.getElementById('viewportCountBadge').textContent = visible.length;
  document.getElementById('gridCountBadge').textContent = visible.length;

  // Ikke bygg alt på nytt (og start strømmene på nytt) hvis utvalget er likt
  const key = visible.map(c => c.id).join(',');
  if (key === lastKey) return;
  lastKey = key;

  destroyPlayers();
  markerGroup.clearLayers();
  const grid = document.getElementById('cameraGrid');

  if (!visible.length) {
    grid.innerHTML = `<div class="col-span-full bg-ops-panel border border-ops-border rounded-xl p-8 text-center text-sm text-slate-300">Ingen noder i dette kartutsnittet. Zoom ut eller trykk «Vis hele Sør-Vest».</div>`;
    return;
  }

  grid.innerHTML = visible.map(c => `
    <article class="bg-ops-card border border-ops-border rounded-2xl overflow-hidden flex flex-col">
      <div class="px-3 py-2 bg-slate-900/90 border-b border-ops-border flex items-center justify-between gap-2">
        <div class="flex items-center gap-1.5 min-w-0">
          <span class="px-1.5 py-0.5 text-[10px] font-mono font-bold rounded bg-sky-500/20 text-sky-400 shrink-0">${esc(c.road)}</span>
          <h3 class="font-semibold text-xs text-white truncate" title="${esc(c.name)}">${esc(c.name)}</h3>
        </div>
        <span class="text-[11px] text-slate-400 shrink-0">${esc(c.municipality)}</span>
      </div>
      <div id="player-${c.id}" class="relative bg-black aspect-video overflow-hidden"></div>
      <div class="px-3 py-2 bg-slate-950/90 flex items-center justify-between text-[11px]">
        <span class="text-slate-400 font-mono">${c.lat == null ? 'GPS: ukjent' : `GPS: ${c.lat.toFixed(3)}, ${c.lng.toFixed(3)}`}</span>
        <span id="status-${c.id}" class="font-mono text-slate-400"></span>
      </div>
    </article>`).join('');

  let started = 0;
  visible.forEach(c => {
    const auto = !!c.streamUrl && started < MAX_AUTOPLAY;
    if (auto) started++;
    mountPlayer(c, auto);

    if (c.lat != null) {
      const icon = L.divIcon({
        html: '<div class="custom-marker w-6 h-6 bg-sky-500 border-2 border-slate-950 text-[11px]">📷</div>',
        className: '', iconSize: [24, 24], iconAnchor: [12, 12]
      });
      L.marker([c.lat, c.lng], { icon }).bindPopup(`
        <div style="font-size:12px"><b>${esc(c.name)}</b><br>${esc(c.municipality)}<br>
        <a href="${esc(detailUrl(c))}" target="_blank" rel="noopener" style="color:#38BDF8">Åpne vegkamera ↗</a></div>`)
        .addTo(markerGroup);
    }
  });
}

function refreshCameras() { lastKey = null; applyFilters(); }

setInterval(() => {
  document.getElementById('liveClock').textContent = new Date().toLocaleTimeString('no-NO', { hour12: false });
}, 1000);

window.addEventListener('DOMContentLoaded', () => {
  initMap();
  setCategory('ALL');
  setMapLayer('streets');
});
</script>
</body>
</html>
