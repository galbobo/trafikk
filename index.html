<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sør-Vest – Kamerasentral</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%2300d4ff'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#070b11; --panel:#0d141d; --panel2:#111b27; --line:#1c2a3a; --txt:#d5e1ee; --mut:#7d8ea3;
  --acc:#19c8ff; --ok:#2ee6a6; --err:#ff4d5e; --warn:#ffb020; --off:#6b7a8c; --tile-min:340px;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font:14px/1.4 var(--sans);display:grid;grid-template-rows:auto 1fr;height:100vh;height:100dvh;overflow:hidden}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 11px;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--acc);color:#fff}
.btn.on{background:rgba(25,200,255,.14);border-color:var(--acc);color:#fff}
.btn.danger:hover{border-color:var(--err);color:var(--err)}

/* Topbar */
header.top{display:flex;align-items:center;gap:18px;padding:8px 14px;background:linear-gradient(#0f1823,#0a1119);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{width:30px;height:30px;border:2px solid var(--acc);border-radius:50%;position:relative;box-shadow:0 0 12px rgba(25,200,255,.5)}
.brand .logo::after{content:"";position:absolute;inset:7px;background:var(--acc);border-radius:50%}
.brand h1{font-size:15px;letter-spacing:.14em;text-transform:uppercase;font-weight:650}
.brand small{display:block;color:var(--mut);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.stats{display:flex;gap:6px;margin-left:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px 10px;font-family:var(--mono);font-size:12px;display:flex;gap:7px;align-items:center}
.stat i{width:8px;height:8px;border-radius:50%;display:inline-block}
.stat b{font-size:14px}
.spacer{flex:1}
.clock{text-align:right;font-family:var(--mono)}
.clock .t{font-size:20px;color:#fff;letter-spacing:.06em;line-height:1}
.clock .d{font-size:11px;color:var(--mut);text-transform:uppercase}
.actions{display:flex;gap:6px;flex-wrap:wrap}

/* Layout */
main{display:grid;grid-template-columns:minmax(340px,42%) 1fr;gap:1px;background:var(--line);min-height:0}
.pane{background:var(--bg);min-height:0;min-width:0;position:relative}
#mapPane{display:flex}
#map{flex:1;min-height:0;background:#0b1118}
.mapbar{position:absolute;top:10px;left:10px;display:flex;gap:6px;z-index:5;flex-wrap:wrap;max-width:calc(100% - 20px)}
.mapbar .btn{background:rgba(13,20,29,.92);backdrop-filter:blur(4px)}
.maplegend{position:absolute;left:10px;bottom:10px;z-index:5;background:rgba(13,20,29,.92);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:12px;display:flex;gap:12px;flex-wrap:wrap}
.maplegend span{display:flex;gap:5px;align-items:center}
.maplegend i{width:9px;height:9px;border-radius:50%;display:inline-block}
.mapnote{position:absolute;right:10px;top:10px;z-index:5;max-width:260px;background:rgba(60,40,5,.92);border:1px solid var(--warn);color:#ffd88a;border-radius:6px;padding:7px 10px;font-size:12px}
.mapnote button{margin-top:5px;font-size:12px}
.pick #map{cursor:crosshair}
.pickhint{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:6;background:var(--acc);color:#001018;font-weight:600;border-radius:6px;padding:6px 12px;display:none}
.pick .pickhint{display:block}

/* Wall */
#wallPane{display:flex;flex-direction:column}
.walltools{display:flex;gap:8px;align-items:center;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{background:transparent;border:1px solid var(--line);border-radius:99px;padding:3px 11px;font-size:12px;color:var(--mut)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#001018;font-weight:600}
.walltools input[type=search]{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 9px;width:170px}
.walltools select{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
#wall{flex:1;overflow:auto;padding:8px;display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--tile-min),1fr));gap:8px;align-content:start;background:var(--bg)}
#wall:fullscreen{background:var(--bg)}
.empty{grid-column:1/-1;color:var(--mut);text-align:center;padding:40px}

.tile{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .2s, box-shadow .2s}
.tile.flash{border-color:var(--acc);box-shadow:0 0 0 2px rgba(25,200,255,.35),0 0 24px rgba(25,200,255,.25)}
.tile header{display:flex;align-items:center;gap:7px;padding:6px 8px;border-bottom:1px solid var(--line);min-height:34px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--off);flex:none;box-shadow:0 0 6px currentColor;color:var(--off)}
.dot.ok{background:var(--ok);color:var(--ok)} .dot.error{background:var(--err);color:var(--err)} .dot.pending{background:var(--warn);color:var(--warn)}
.tile .name{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.badge{font-size:10px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);color:var(--mut);padding:1px 6px;border-radius:4px;flex:none}
.ts{font-family:var(--mono);font-size:11px;color:var(--mut);flex:none}
.ib{background:none;border:0;color:var(--mut);padding:2px 5px;border-radius:4px;font-size:15px;line-height:1}
.ib:hover{color:#fff;background:var(--panel2)}
.media{position:relative;aspect-ratio:16/9;background:#000;display:grid;place-items:center;overflow:hidden}
.media img,.media video,.media iframe{width:100%;height:100%;border:0;object-fit:contain;background:#000;display:block}
.media img.stale{opacity:.45;filter:grayscale(1)}
.ph{color:var(--mut);text-align:center;padding:14px;font-size:12px;display:flex;flex-direction:column;gap:6px;align-items:center}
.ph b{color:var(--txt);font-size:13px}
.ph a{color:var(--acc)}
.offline-tag{position:absolute;left:8px;bottom:8px;background:rgba(255,77,94,.92);color:#fff;font-size:11px;padding:2px 8px;border-radius:4px;display:none;font-weight:600}
.media.err .offline-tag{display:block}

/* Fullscreen viewer */
#viewer{position:fixed;inset:0;background:#000;z-index:100;display:none;flex-direction:column}
#viewer.open{display:flex}
#viewer .vbar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:linear-gradient(rgba(0,0,0,.85),rgba(0,0,0,0));position:absolute;left:0;right:0;top:0;z-index:2;transition:opacity .4s}
#viewer .vbar h2{font-size:18px;font-weight:600}
#viewer .vbar .badge{font-size:11px}
#viewer .vfoot{position:absolute;left:0;right:0;bottom:0;padding:10px 16px;display:flex;gap:12px;align-items:center;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.85));z-index:2;transition:opacity .4s;font-family:var(--mono);color:var(--mut)}
#viewer.idle .vbar,#viewer.idle .vfoot,#viewer.idle .nav{opacity:0}
#viewer.idle{cursor:none}
#vmedia{flex:1;position:relative;display:grid;place-items:center}
#vmedia img,#vmedia video,#vmedia iframe{width:100%;height:100%;border:0;object-fit:contain;background:#000}
#vmedia img.stale{opacity:.45}
#viewer .nav{position:absolute;top:50%;transform:translateY(-50%);z-index:2;font-size:34px;background:rgba(13,20,29,.6);border:1px solid var(--line);border-radius:8px;padding:10px 14px;transition:opacity .4s}
#viewer .nav:hover{border-color:var(--acc)}
#viewer .prev{left:14px}#viewer .next{right:14px}

/* Dialog */
dialog{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:0;width:min(560px,94vw);box-shadow:0 20px 60px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(0,0,0,.65)}
dialog form{padding:18px;display:grid;gap:10px}
dialog h3{font-size:15px;letter-spacing:.06em;text-transform:uppercase}
dialog label{display:grid;gap:3px;font-size:12px;color:var(--mut)}
dialog input,dialog select{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;color:var(--txt)}
dialog .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
dialog .row3{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end}
dialog .hint{font-size:12px;color:var(--mut)}
dialog menu{display:flex;gap:8px;justify-content:flex-end;padding:0;margin-top:6px}

.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--acc);padding:8px 16px;border-radius:8px;z-index:200;display:none}

.gm-style .gm-style-iw-c{background:#0d141d!important;color:#d5e1ee!important;padding:10px!important}
.gm-style .gm-style-iw-d{overflow:auto!important}
.gm-style .gm-style-iw-tc::after{background:#0d141d!important}
.gm-ui-hover-effect>span{background-color:#d5e1ee!important}
.pop b{display:block;margin-bottom:2px}
.pop small{color:#7d8ea3}
.pop button{margin-top:7px;background:#19c8ff;color:#001018;border:0;border-radius:5px;padding:4px 10px;font-weight:600}
.leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.9) saturate(.7)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#0d141d;color:#d5e1ee}
.lm{width:16px;height:16px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 8px rgba(0,0,0,.7)}

@media (max-width:980px){
  body{overflow:auto;height:auto}
  main{grid-template-columns:1fr;grid-template-rows:46vh auto}
  #wall{overflow:visible}
  .stats{display:none}
}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <div class="logo"></div>
    <div><h1>Kamerasentral</h1><small>Sør-Vest politidistrikt</small></div>
  </div>
  <div class="stats">
    <div class="stat"><i style="background:var(--acc)"></i>Totalt <b id="sTotal">0</b></div>
    <div class="stat"><i style="background:var(--ok)"></i>Online <b id="sOk">0</b></div>
    <div class="stat"><i style="background:var(--err)"></i>Feil <b id="sErr">0</b></div>
    <div class="stat"><i style="background:var(--off)"></i>Ikke satt opp <b id="sOff">0</b></div>
  </div>
  <div class="spacer"></div>
  <div class="actions">
    <button class="btn" id="btnAdd">＋ Kamera</button>
    <button class="btn" id="btnKey" title="Google Maps API-nøkkel">🔑 Kartnøkkel</button>
    <button class="btn" id="btnExport">Eksporter</button>
    <button class="btn" id="btnImport">Importer</button>
    <button class="btn danger" id="btnReset">Tilbakestill</button>
    <input type="file" id="fileImport" accept="application/json" hidden>
  </div>
  <div class="clock"><div class="t" id="clk">--:--:--</div><div class="d" id="clkd"></div></div>
</header>

<main>
  <section class="pane" id="mapPane">
    <div class="mapbar">
      <button class="btn on" id="btnTraffic">🚦 Trafikk</button>
      <button class="btn" id="btnSat">🛰 Satellitt</button>
      <button class="btn" id="btnFit">⤢ Vis alle</button>
    </div>
    <div class="pickhint">Klikk i kartet for å velge posisjon (Esc avbryter)</div>
    <div id="map"></div>
    <div class="maplegend">
      <span><i style="background:var(--ok)"></i>Online</span>
      <span><i style="background:var(--err)"></i>Feil</span>
      <span><i style="background:var(--warn)"></i>Laster</span>
      <span><i style="background:var(--off)"></i>Ikke satt opp</span>
    </div>
  </section>

  <section class="pane" id="wallPane">
    <div class="walltools">
      <div class="chips" id="chips"></div>
      <input type="search" id="q" placeholder="Søk kamera …">
      <div class="spacer"></div>
      <select id="size" title="Størrelse">
        <option value="260px">Små ruter</option>
        <option value="340px" selected>Middels</option>
        <option value="520px">Store</option>
        <option value="900px">1 per rad</option>
      </select>
      <button class="btn" id="btnWallFs">⛶ Vegg i fullskjerm</button>
    </div>
    <div id="wall"></div>
  </section>
</main>

<div id="viewer">
  <div class="vbar">
    <span class="dot" id="vdot"></span>
    <h2 id="vname"></h2><span class="badge" id="vsrc"></span>
    <div class="spacer"></div>
    <span class="ts" id="vcount"></span>
    <button class="btn" id="vclose">✕ Lukk (Esc)</button>
  </div>
  <button class="nav prev" id="vprev" aria-label="Forrige">‹</button>
  <div id="vmedia"></div>
  <button class="nav next" id="vnext" aria-label="Neste">›</button>
  <div class="vfoot"><span id="vts"></span><span class="spacer"></span><span>← → bytt kamera</span></div>
</div>

<dialog id="editor">
  <form method="dialog" id="editForm">
    <h3 id="editTitle">Kamera</h3>
    <label>Navn<input id="fName" required placeholder="F.eks. E39 Forus"></label>
    <div class="row">
      <label>Kilde<select id="fSource"></select></label>
      <label>Type<select id="fType"></select></label>
    </div>
    <label>Strøm-URL / ID<input id="fUrl" placeholder="https://…  (Vegvesen: kamera-ID  ·  YouTube: video-ID eller lenke)"></label>
    <div class="hint" id="fHint"></div>
    <div class="row3">
      <label>Breddegrad<input id="fLat" type="number" step="any"></label>
      <label>Lengdegrad<input id="fLng" type="number" step="any"></label>
      <button type="button" class="btn" id="fPick">📍 Velg i kart</button>
    </div>
    <div class="row">
      <label>Oppdatering (sek, stillbilde)<input id="fRef" type="number" min="3" placeholder="30"></label>
      <label>Kildeside (valgfri lenke)<input id="fPage" placeholder="https://…"></label>
    </div>
    <menu>
      <button type="button" class="btn danger" id="fDel">Slett</button>
      <span class="spacer"></span>
      <button type="button" class="btn" id="fCancel">Avbryt</button>
      <button type="submit" class="btn on" id="fSave" value="save">Lagre</button>
    </menu>
  </form>
</dialog>
<div class="toast" id="toast"></div>

<script>
/* ==========================================================================
   KONFIGURASJON
   ========================================================================== */
const CONFIG = {
  // Google Maps JavaScript API-nøkkel (aktiver "Maps JavaScript API" i Google Cloud).
  // Kan også settes via knappen «Kartnøkkel» øverst (lagres i nettleseren).
  GOOGLE_MAPS_API_KEY: "",
  MAP_CENTER: { lat: 58.97, lng: 6.0 },   // Rogaland
  MAP_ZOOM: 9,
  DEFAULT_REFRESH_SEC: 30,                // standard oppdatering for stillbilder

const fmtTime = d => d ? d.toLocaleTimeString("nb-NO",{timeZone:"Europe/Oslo",hour12:false}) : "–";

function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=()=>rej(new Error("Kunne ikke laste "+src)); document.head.appendChild(s); }); }

async function loadCams(){
  try{
    const saved = JSON.parse(localStorage.getItem(CONFIG.STORAGE_KEY) || "null");
    if (Array.isArray(saved)) { cams = saved; return; }
  }catch(e){}
  cams = JSON.parse(JSON.stringify(DEFAULT_CAMERAS));
  try{

    if (r.ok){ const extra = await r.json(); if (Array.isArray(extra)) extra.forEach(c=>{ c.id=c.id||uid(); cams.push(c); }); }
  }catch(e){ /* ingen ekstra fil – helt normalt */ }
}
function saveCams(){ try{ localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(cams)); }catch(e){ toast("Kunne ikke lagre i nettleseren"); } }

function resolveUrl(cam){
  const u = (cam.url||"").trim();
  if (!u) return "";
  if (cam.type==="youtube"){
    const base = "https://www.youtube.com/embed/";
    const q = "autoplay=1&mute=1&playsinline=1&rel=0&modestbranding=1";
    if (/^UC[\w-]{22}$/.test(u)) return `${base}live_stream?channel=${u}&${q}`;
    if (/^[\w-]{11}$/.test(u)) return `${base}${u}?${q}`;
    const m = u.match(/(?:v=|youtu\.be\/|embed\/|live\/)([\w-]{11})/);
    if (m) return `${base}${m[1]}?${q}`;
    const c = u.match(/channel\/(UC[\w-]{22})/);
    if (c) return `${base}live_stream?channel=${c[1]}&${q}`;
    return u;
  }
  if (cam.source==="Vegvesen" && /^[\w-]+$/.test(u)) return `https://webkamera.atlas.vegvesen.no/public/kamera?id=${encodeURIComponent(u)}`;
  return u;
}

/* ==========================================================================
   MEDIA – starter automatisk. Returnerer {destroy()}
   ========================================================================== */
let hlsLoading = null;
function ensureHls(){ return hlsLoading || (hlsLoading = loadScript("https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.17/hls.min.js")); }

function placeholder(host, cam, text){
  host.innerHTML = "";
  const d = document.createElement("div"); d.className = "ph";
  const b = document.createElement("b"); b.textContent = text; d.append(b);
  const p = document.createElement("span"); p.textContent = "Åpne ✎ for å legge inn strøm-URL."; d.append(p);
  if (cam.page){ const a=document.createElement("a"); a.href=cam.page; a.target="_blank"; a.rel="noopener"; a.textContent="Åpne kildeside ↗"; d.append(a); }
  host.append(d);
}

function mountMedia(cam, host, onStatus){
  const url = resolveUrl(cam);
  const timers = []; let hls = null, dead = false;
  const destroy = () => { dead = true; timers.forEach(clearInterval); timers.length=0; if (hls){ try{hls.destroy();}catch(e){} hls=null; } host.innerHTML=""; host.classList.remove("err"); };
  host.innerHTML = ""; host.classList.remove("err");
  if (!url){ placeholder(host, cam, "Ingen strøm-URL konfigurert"); onStatus("unconfigured"); return { destroy }; }

  const ok  = () => { if(dead) return; host.classList.remove("err"); onStatus("ok", new Date()); };
  const bad = () => { if(dead) return; host.classList.add("err"); onStatus("error"); };
  const tag = () => { const t=document.createElement("div"); t.className="offline-tag"; t.textContent="Ingen kontakt"; host.append(t); };
  onStatus("pending");

  switch (cam.type){
    case "image": {
      const img = document.createElement("img"); img.alt = cam.name; host.append(img); tag();
      const tick = () => {
        const l = new Image(); const u = url + (url.includes("?")?"&":"?") + "_t=" + Date.now();
        l.onload = () => { if(dead) return; img.src = u; img.classList.remove("stale"); ok(); };
        l.onerror = () => { if(dead) return; img.classList.add("stale"); bad(); };
        l.src = u;
      };
      tick(); timers.push(setInterval(tick, Math.max(3, cam.refresh || CONFIG.DEFAULT_REFRESH_SEC) * 1000));
      break;
    }
    case "mjpeg": {
      const img = document.createElement("img"); img.alt = cam.name; img.onload = ok; img.onerror = bad; img.src = url; host.append(img); tag(); break;
    }
    case "video": case "hls": {
      const v = document.createElement("video");
      v.muted = true; v.autoplay = true; v.loop = true; v.playsInline = true; v.controls = true;
      v.setAttribute("muted",""); v.setAttribute("playsinline","");
      v.addEventListener("playing", ok); v.addEventListener("error", bad);
      host.append(v); tag();
      if (cam.type==="hls" && !v.canPlayType("application/vnd.apple.mpegurl")){
        ensureHls().then(() => {
          if (dead) return;
          if (!window.Hls || !Hls.isSupported()) return bad();
          hls = new Hls({ lowLatencyMode:true });
          hls.on(Hls.Events.ERROR, (_, d) => { if (d.fatal){ bad(); try{ d.type===Hls.ErrorTypes.NETWORK_ERROR ? hls.startLoad() : hls.recoverMediaError(); }catch(e){} } });
          hls.loadSource(url); hls.attachMedia(v);
          v.play().catch(()=>{});
        }).catch(bad);
      } else { v.src = url; v.play().catch(()=>{}); }
      break;
    }
    default: { // youtube / iframe
      const f = document.createElement("iframe");
      f.allow = "autoplay; fullscreen; picture-in-picture; encrypted-media"; f.allowFullscreen = true;
      f.referrerPolicy = "strict-origin-when-cross-origin"; f.title = cam.name;
      f.onload = ok; f.onerror = bad; f.src = url; host.append(f); tag();
    }
  }
  return { destroy };
}

const wall = $("#wall");
const tiles = new Map();   // id -> {el, mount, retry}

function setStatus(id, s, t){
  if (s==="ok") status[id] = { s, t }; else status[id] = { s, t: status[id]?.t };
  const tl = tiles.get(id);
  if (tl){
    tl.el.querySelector(".dot").className = "dot " + (s==="unconfigured"?"":s);
    tl.el.querySelector(".ts").textContent = status[id].t ? fmtTime(status[id].t) : "";
  }
  mapApi && mapApi.setStatus(id, s);
  refreshStats();
  if (viewerCam && viewerCam.id===id) updateViewerStatus();
}

function startTile(cam){
  const tl = tiles.get(cam.id); if (!tl) return;
  tl.mount && tl.mount.destroy(); clearTimeout(tl.retry);
  tl.mount = mountMedia(cam, tl.el.querySelector(".media"), (s,t) => {
    setStatus(cam.id, s, t);
    if (s==="error" && cam.type!=="image"){ clearTimeout(tl.retry); tl.retry = setTimeout(()=>startTile(cam), CONFIG.RETRY_SEC*1000); }
  });
}

function buildTile(cam){
  const el = document.createElement("article"); el.className = "tile"; el.dataset.id = cam.id;
  el.innerHTML = `<header><span class="dot"></span><span class="name"></span><span class="badge"></span><span class="ts"></span>
    <button class="ib loc" title="Vis i kart">⌖</button><button class="ib edit" title="Rediger">✎</button><button class="ib fs" title="Fullskjerm">⛶</button></header>
    <div class="media"></div>`;
  el.querySelector(".name").textContent = cam.name; if (cam.note) el.querySelector(".name").title = cam.note;
  el.querySelector(".badge").textContent = cam.source;
  el.querySelector(".fs").onclick = () => openViewer(cam.id);
  el.querySelector(".edit").onclick = () => openEditor(cam.id);
  el.querySelector(".loc").onclick = () => { if (cam.lat!=null && cam.lng!=null) mapApi.focus(cam.id); else toast("Kameraet har ingen kjent posisjon"); };
  el.querySelector(".media").addEventListener("dblclick", () => openViewer(cam.id));
  return el;
}

function renderWall(){
  tiles.forEach(t => { t.mount && t.mount.destroy(); clearTimeout(t.retry); });
  tiles.clear(); wall.innerHTML = "";
  if (!cams.length){ wall.innerHTML = '<div class="empty">Ingen kameraer. Trykk «＋ Kamera» for å legge til.</div>'; }
  cams.forEach(cam => { const el = buildTile(cam); wall.append(el); tiles.set(cam.id, { el }); });
  buildChips(); applyFilter();
  cams.forEach(startTile);          // automatisk start ved lasting
  refreshStats();
}

function visibleCams(){
  const q = filterText.toLowerCase();
  return cams.filter(c => (filterSource==="Alle" || c.source===filterSource) && (!q || (c.name+" "+c.source).toLowerCase().includes(q)));
}
function applyFilter(){
  const vis = new Set(visibleCams().map(c=>c.id));
  tiles.forEach((t,id) => t.el.style.display = vis.has(id) ? "" : "none");
  mapApi && mapApi.setVisible && mapApi.setVisible(vis);
}
function buildChips(){
  const box = $("#chips"); box.innerHTML = "";
  const present = ["Alle", ...SOURCES.filter(s => cams.some(c=>c.source===s))];
  if (!present.includes(filterSource)) filterSource = "Alle";
  present.forEach(s => {
    const b = document.createElement("button"); b.className = "chip" + (s===filterSource?" on":""); b.textContent = s;
    b.onclick = () => { filterSource = s; buildChips(); applyFilter(); };
    box.append(b);
  });
}
function refreshStats(){
  const v = Object.values(status);
  $("#sTotal").textContent = cams.length;
  $("#sOk").textContent  = cams.filter(c=>status[c.id]?.s==="ok").length;
  $("#sErr").textContent = cams.filter(c=>status[c.id]?.s==="error").length;
  $("#sOff").textContent = cams.filter(c=>status[c.id]?.s==="unconfigured").length;
}
function flashTile(id){
  const t = tiles.get(id); if (!t) return;
  if (t.el.style.display==="none"){ filterSource="Alle"; filterText=""; $("#q").value=""; buildChips(); applyFilter(); }
  t.el.scrollIntoView({behavior:"smooth", block:"center"});
  t.el.classList.add("flash"); setTimeout(()=>t.el.classList.remove("flash"), 2200);
}

/* ==========================================================================
   FULLSKJERM-VISNING
   ========================================================================== */
const viewer = $("#viewer"); let viewerCam = null, viewerMount = null, viewerList = [], idleT;
function openViewer(id){
  viewerList = visibleCams(); if (!viewerList.some(c=>c.id===id)) viewerList = cams.slice();
  viewer.classList.add("open"); showViewer(id);
  (viewer.requestFullscreen ? viewer.requestFullscreen() : Promise.reject()).catch(()=>{ /* faller tilbake til fullt vindu */ });
  wakeViewer();
}
function showViewer(id){
  viewerMount && viewerMount.destroy();
  viewerCam = viewerList.find(c=>c.id===id) || viewerList[0];
  $("#vname").textContent = viewerCam.name; $("#vsrc").textContent = viewerCam.source;
  $("#vcount").textContent = (viewerList.indexOf(viewerCam)+1) + " / " + viewerList.length;
  viewerMount = mountMedia(viewerCam, $("#vmedia"), (s,t) => { if (s==="ok") status[viewerCam.id] = {s,t}; updateViewerStatus(s); });
}
function updateViewerStatus(s){
  const st = s || status[viewerCam.id]?.s || "pending";
  $("#vdot").className = "dot " + (st==="unconfigured"?"":st);
  $("#vts").textContent = "Siste bilde: " + fmtTime(status[viewerCam.id]?.t);
}
function stepViewer(d){
  const i = viewerList.indexOf(viewerCam); const n = viewerList[(i+d+viewerList.length)%viewerList.length];
  showViewer(n.id);
}
function closeViewer(){
  if (!viewer.classList.contains("open")) return;
  viewerMount && viewerMount.destroy(); viewerMount = null; viewerCam = null;
  viewer.classList.remove("open");
  if (document.fullscreenElement===viewer) document.exitFullscreen().catch(()=>{});
}
function wakeViewer(){ viewer.classList.remove("idle"); clearTimeout(idleT); idleT = setTimeout(()=>viewer.classList.add("idle"), 3000); }
viewer.addEventListener("mousemove", wakeViewer); viewer.addEventListener("click", wakeViewer);
$("#vclose").onclick = closeViewer; $("#vprev").onclick = ()=>stepViewer(-1); $("#vnext").onclick = ()=>stepViewer(1);
document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement && viewer.classList.contains("open")) closeViewer(); });
document.addEventListener("keydown", e => {
  if (viewer.classList.contains("open")){
    if (e.key==="Escape") closeViewer();
    else if (e.key==="ArrowRight") stepViewer(1);
    else if (e.key==="ArrowLeft") stepViewer(-1);
    wakeViewer();
  } else if (e.key==="Escape" && pickCb) cancelPick();
});

const DARK_STYLE = [
  {elementType:"geometry",stylers:[{color:"#0f1722"}]},
  {elementType:"labels.text.fill",stylers:[{color:"#8aa0b8"}]},
  {elementType:"labels.text.stroke",stylers:[{color:"#0b1118"}]},
  {featureType:"poi",stylers:[{visibility:"off"}]},
  {featureType:"transit",stylers:[{visibility:"off"}]},

function noteBox(msg, withBtn){

function googleMapApi(){
  const map = new google.maps.Map($("#map"), {
    center: CONFIG.MAP_CENTER, zoom: CONFIG.MAP_ZOOM, styles: DARK_STYLE, disableDefaultUI: false,
    mapTypeControl:false, streetViewControl:false, fullscreenControl:false, gestureHandling:"greedy", clickableIcons:false
  });
  const traffic = new google.maps.TrafficLayer(); traffic.setMap(map);
  const info = new google.maps.InfoWindow();
  const markers = new Map();
  map.addListener("click", e => handleMapClick(e.latLng.lat(), e.latLng.lng()));
  const icon = s => ({ path: google.maps.SymbolPath.CIRCLE, scale: 8, fillColor: STATUS_COLOR[s]||STATUS_COLOR.pending, fillOpacity:1, strokeColor:"#fff", strokeWeight:2 });
  const api = {
    kind:"google",
    add(cam){
      if (cam.lat==null || cam.lng==null || cam.lat==="" ) return;
      const m = new google.maps.Marker({ position:{lat:+cam.lat,lng:+cam.lng}, map, title:cam.name, icon: icon(status[cam.id]?.s) });
      m.addListener("click", () => { info.setContent(popupEl(cam)); info.open(map, m); flashTile(cam.id); });
      markers.set(cam.id, m);
    },
    clear(){ markers.forEach(m=>m.setMap(null)); markers.clear(); },
    setStatus(id,s){ markers.get(id)?.setIcon(icon(s)); },
    setVisible(set){ markers.forEach((m,id)=>m.setVisible(set.has(id))); },
    focus(id){ const m=markers.get(id); if(!m) return; map.panTo(m.getPosition()); map.setZoom(Math.max(map.getZoom(),13)); google.maps.event.trigger(m,"click"); },
    fit(){
      const b = new google.maps.LatLngBounds(); markers.forEach(m=>{ if(m.getVisible()) b.extend(m.getPosition()); });
      if (!b.isEmpty()) { map.fitBounds(b, 60); if (markers.size===1) map.setZoom(12); } else { map.setCenter(CONFIG.MAP_CENTER); map.setZoom(CONFIG.MAP_ZOOM); }
    },
    traffic(on){ traffic.setMap(on?map:null); },
    satellite(on){ map.setMapTypeId(on?"hybrid":"roadmap"); }
  };
  return api;
}

function leafletMapApi(){
  const map = L.map("map", { zoomControl:true }).setView([CONFIG.MAP_CENTER.lat, CONFIG.MAP_CENTER.lng], CONFIG.MAP_ZOOM);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom:19, attribution:"© OpenStreetMap" }).addTo(map);
  const markers = new Map();
  map.on("click", e => handleMapClick(e.latlng.lat, e.latlng.lng));
  const mk = s => L.divIcon({ className:"", html:`<div class="lm" style="background:${STATUS_COLOR[s]||STATUS_COLOR.pending}"></div>`, iconSize:[16,16], iconAnchor:[8,8] });
  return {
    kind:"leaflet",
    add(cam){
      if (cam.lat==null || cam.lng==null || cam.lat==="") return;
      const m = L.marker([+cam.lat,+cam.lng], { icon: mk(status[cam.id]?.s), title:cam.name }).addTo(map);
      m.bindPopup(() => popupEl(cam)); m.on("click", () => flashTile(cam.id)); markers.set(cam.id, m);
    },
    clear(){ markers.forEach(m=>m.remove()); markers.clear(); },
    setStatus(id,s){ markers.get(id)?.setIcon(mk(s)); },
    setVisible(set){ markers.forEach((m,id)=> set.has(id) ? m.addTo(map) : m.remove()); },
    focus(id){ const m=markers.get(id); if(!m) return; map.setView(m.getLatLng(), Math.max(map.getZoom(),13)); m.openPopup(); },
    fit(){ const pts=[...markers.values()].map(m=>m.getLatLng()); if(pts.length) map.fitBounds(L.latLngBounds(pts).pad(.2)); else map.setView([CONFIG.MAP_CENTER.lat,CONFIG.MAP_CENTER.lng],CONFIG.MAP_ZOOM); },
    traffic(){ toast("Trafikkbilde krever Google Maps-nøkkel"); },
    satellite(){ toast("Satellitt krever Google Maps-nøkkel"); },
    destroy(){ map.remove(); }
  };
}

function getKey(){ return CONFIG.GOOGLE_MAPS_API_KEY || localStorage.getItem("sv-gmaps-key") || ""; }

async function startLeaflet(msg){

async function initMap(){
  const key = getKey();
  if (!key){ try{ await startLeaflet("Ingen Google Maps-nøkkel – viser OpenStreetMap uten trafikkbilde."); }catch(e){ toast("Kartet kunne ikke lastes"); } return; }
  window.gm_authFailure = () => { startLeaflet("Google Maps avviste nøkkelen – viser OpenStreetMap uten trafikkbilde.").catch(()=>{}); };
  try{
    await new Promise((res,rej)=>{
      window.__gmReady = res;
      const s=document.createElement("script");
      s.src=`https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(key)}&callback=__gmReady&v=weekly&language=no&region=NO`;
      s.onerror=()=>rej(new Error("gmaps")); document.head.appendChild(s);
    });
    mapApi = googleMapApi(); cams.forEach(c=>mapApi.add(c)); mapApi.fit();
    Object.keys(status).forEach(id=>mapApi.setStatus(id,status[id].s));
  }catch(e){ await startLeaflet("Kunne ikke laste Google Maps – viser OpenStreetMap."); }
}

$("#btnTraffic").onclick = e => { const on = !e.currentTarget.classList.contains("on"); if (mapApi.kind==="google"){ e.currentTarget.classList.toggle("on", on); mapApi.traffic(on); } else mapApi.traffic(); };
$("#btnSat").onclick = e => { if (mapApi.kind==="google"){ const on=!e.currentTarget.classList.contains("on"); e.currentTarget.classList.toggle("on",on); mapApi.satellite(on); } else mapApi.satellite(); };
$("#btnFit").onclick = () => mapApi && mapApi.fit();
$("#btnKey").onclick = askKey;

/* ==========================================================================
   EDITOR / IMPORT / EKSPORT
   ========================================================================== */
const dlg = $("#editor"); let editId = null;
SOURCES.forEach(s => $("#fSource").add(new Option(s,s)));
TYPES.forEach(([v,l]) => $("#fType").add(new Option(l,v)));
$("#fType").onchange = () => $("#fHint").textContent = TYPE_HINT[$("#fType").value];
$("#fSource").onchange = () => { if ($("#fSource").value==="YouTube") $("#fType").value="youtube"; $("#fType").onchange(); };

function openEditor(id){
  editId = id || null;
  const c = id ? cams.find(x=>x.id===id) : { name:"", source:"Vegvesen", type:"image", url:"", lat:"", lng:"", refresh:"", page:"" };
  $("#editTitle").textContent = id ? "Rediger kamera" : "Nytt kamera";
  $("#fName").value=c.name; $("#fSource").value=c.source; $("#fType").value=c.type; $("#fUrl").value=c.url||"";
  $("#fLat").value=c.lat??""; $("#fLng").value=c.lng??""; $("#fRef").value=c.refresh||""; $("#fPage").value=c.page||"";
  $("#fDel").style.display = id ? "" : "none"; $("#fType").onchange();
  dlg.showModal();
}
$("#btnAdd").onclick = () => openEditor();
$("#fCancel").onclick = () => dlg.close();
$("#fPick").onclick = () => {
  dlg.close(); mapPane.classList.add("pick"); mapPane.scrollIntoView({block:"nearest"});
  pickCb = (lat,lng) => { dlg.showModal(); $("#fLat").value=lat.toFixed(5); $("#fLng").value=lng.toFixed(5); };
};
$("#editForm").addEventListener("submit", e => {
  e.preventDefault();
  const num = v => v==="" ? null : +v;
  const data = { name:$("#fName").value.trim(), source:$("#fSource").value, type:$("#fType").value, url:$("#fUrl").value.trim(),
                 lat:num($("#fLat").value), lng:num($("#fLng").value), refresh:num($("#fRef").value)||undefined, page:$("#fPage").value.trim()||undefined };
  if (editId){ Object.assign(cams.find(c=>c.id===editId), data); } else cams.push({ id:uid(), ...data });
  dlg.close(); saveCams(); rebuildAll();
});
$("#fDel").onclick = () => { if (confirm("Slette dette kameraet?")){ cams = cams.filter(c=>c.id!==editId); dlg.close(); saveCams(); rebuildAll(); } };
function rebuildAll(){ renderWall(); if (mapApi){ mapApi.clear(); cams.forEach(c=>mapApi.add(c)); Object.keys(status).forEach(id=>mapApi.setStatus(id,status[id].s)); applyFilter(); } }

$("#btnExport").onclick = () => {
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(cams,null,2)],{type:"application/json"}));
  a.download = "kameraer.json"; a.click(); URL.revokeObjectURL(a.href);
};
$("#btnImport").onclick = () => $("#fileImport").click();
$("#fileImport").onchange = async e => {
  const f = e.target.files[0]; if(!f) return;
  try{
    const arr = JSON.parse(await f.text()); if (!Array.isArray(arr)) throw 0;
    arr.forEach(c => { c.id = c.id || uid(); c.type = c.type || "image"; c.source = c.source || "Annet"; });
    cams = arr; saveCams(); rebuildAll(); toast(`Importerte ${arr.length} kameraer`);
  }catch(err){ toast("Ugyldig JSON-fil"); }
  e.target.value = "";
};
$("#btnReset").onclick = () => { if (confirm("Tilbakestille til standardlisten? Egne endringer slettes.")){ localStorage.removeItem(CONFIG.STORAGE_KEY); location.reload(); } };

/* ==========================================================================
   OPPSETT
   ========================================================================== */
$("#q").addEventListener("input", e => { filterText = e.target.value; applyFilter(); });
$("#size").onchange = e => document.documentElement.style.setProperty("--tile-min", e.target.value);
$("#btnWallFs").onclick = () => { if (document.fullscreenElement===wall) document.exitFullscreen(); else wall.requestFullscreen?.().catch(()=>toast("Fullskjerm ikke tilgjengelig")); };

function tickClock(){
  const n = new Date();
  $("#clk").textContent = n.toLocaleTimeString("nb-NO",{timeZone:"Europe/Oslo",hour12:false});
  $("#clkd").textContent = n.toLocaleDateString("nb-NO",{timeZone:"Europe/Oslo",weekday:"short",day:"2-digit",month:"short",year:"numeric"});
}
setInterval(tickClock,1000); tickClock();

(async function boot(){
  await loadCams();
  renderWall();          // starter alle kamerastrømmer automatisk
  await initMap();
  applyFilter();
})();
</script>
</body>
</html>
